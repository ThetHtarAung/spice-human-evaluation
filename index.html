<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Visual Story Consistency Human Evaluation</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

* {
  box-sizing: border-box;
}

:root {
  /* Clean White & Dark Blue Color Palette */
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #0f172a;       /* Dark Navy */
  --muted: #64748b;      /* Cool Slate Gray */
  --light: #f1f5f9;      /* Light Cool Gray */
  --border: #e2e8f0;     /* Soft Border */
  --border-strong: #cbd5e1;
  --ink: #0f172a;        /* Deep Slate/Navy */
  --accent: #2563eb;     /* Vivid Blue */
  --accent-dark: #1d4ed8;
  --accent-tint: #eff6ff;/* Soft Blue Tint */
  --danger: #dc2626;
  --warn: #fef3c7;
  --warntext: #92400e;
  --ok: #dcfce7;
  --oktext: #166534;
  --r: 12px;
  --rs: 8px;
  --font-display: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
}

body {
  margin: 0;
  background: var(--bg);
  background-image: radial-gradient(circle at 1px 1px, rgba(15,23,42,.04) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 17px;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

button, input, select {
  font-family: inherit;
}

button {
  transition: background-color .15s ease, border-color .15s ease, transform .05s ease, color .15s ease;
}

button:active:not(:disabled) {
  transform: translateY(1px);
}

button:disabled {
  cursor: not-allowed;
  opacity: .4;
}

button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

input[type=checkbox], input[type=radio] {
  accent-color: var(--accent);
  width: 16px;
  height: 16px;
}

input[type=text], select, textarea {
  width: 100%;
  padding: 11px 13px;
  border-radius: var(--rs);
  border: 1px solid var(--border-strong);
  background: #fff;
  color: var(--text);
  font-size: 14px;
  outline: none;
}

textarea {
  min-height: 110px;
  resize: vertical;
  line-height: 1.55;
}

input[type=text]:focus, select:focus, textarea:focus {
  border-color: var(--accent);
}

/* Full Screen Flexible Page Layout */
.page {
  width: 100%;
  min-height: 100vh;
  margin: 0;
  padding: 28px;
  display: flex;
  flex-direction: column;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 28px;
  box-shadow: 0 1px 3px rgba(15,23,42,.04), 0 10px 25px -15px rgba(15,23,42,.08);
  width: 100%;
}

.card + .card {
  margin-top: 16px;
}

.label {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .08em;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.label::before {
  content: "";
  display: inline-block;
  width: 10px;
  height: 2px;
  background: var(--accent);
  flex-shrink: 0;
}

h1 {
  font-family: var(--font-display);
  font-size: 34px;
  margin: 6px 0 12px;
  font-weight: 700;
  letter-spacing: -.02em;
  color: var(--text);
  line-height: 1.2;
}

h2 {
  font-family: var(--font-display);
  font-size: 27px;
  margin: 6px 0 12px;
  font-weight: 700;
  letter-spacing: -.01em;
  color: var(--text);
  line-height: 1.25;
}

h3 {
  font-family: var(--font-display);
  font-size: 19px;
  margin: 0 0 8px;
  font-weight: 600;
  color: var(--text);
}

p { line-height: 1.6; }

.muted {
  color: var(--muted);
  font-size: 16px;
  line-height: 1.7;
}

.btn-primary {
  cursor: pointer;
  padding: 11px 24px;
  border-radius: var(--rs);
  border: 1px solid var(--accent-dark);
  background: var(--accent);
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .01em;
  box-shadow: 0 1px 2px rgba(37,99,235,.2);
}

.btn-primary:hover:not(:disabled) { 
  background: var(--accent-dark); 
}

.btn-secondary {
  cursor: pointer;
  padding: 11px 20px;
  border-radius: var(--rs);
  border: 1px solid var(--border-strong);
  background: #fff;
  color: var(--text);
  font-size: 16px;
  font-weight: 700;
}

.btn-secondary:hover:not(:disabled) { 
  border-color: var(--ink); 
  background: var(--light);
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.row-between {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}

.notice, .success, .error {
  border-radius: var(--rs);
  padding: 13px 15px;
  font-size: 13px;
  line-height: 1.55;
}

.notice { background: var(--warn); color: var(--warntext); border: 1px solid #fde68a; }
.success { background: var(--ok); color: var(--oktext); border: 1px solid #bbf7d0; }
.error { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }

.stat {
  background: var(--light);
  border: 1px solid var(--border);
  border-radius: var(--rs);
  padding: 16px 14px;
  text-align: center;
}

.stat-number {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 600;
  color: var(--ink);
}

.stat-label {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--muted);
  text-transform: uppercase;
  margin-top: 3px;
}

/* Reference Images — grouped by character */
.refs {
  display: flex;
  flex-wrap: wrap;
  gap: 22px 28px;
  width: 100%;
  align-items: flex-start;
}

.ref-group {
  min-width: 220px;
  max-width: 420px;
  flex: 1 1 280px;
  padding: 0;
  background: transparent;
  border: 0;
}

.ref-group-header {
  display: flex;
  align-items: baseline;
  justify-content: flex-start;
  gap: 10px;
  margin-bottom: 7px;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--border);
}

.ref-group-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}

.ref-group-count {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
  white-space: nowrap;
}

.ref-image-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  width: 100%;
}

.ref-card {
  width: 96px;
  min-width: 96px;
  background: transparent;
  border: 0;
  padding: 0;
}

.ref-img {
  width: 96px;
  height: 96px;
  object-fit: contain;
  background: white;
  border-radius: 5px;
  border: 1px solid var(--border);
}

.ref-description {
  margin-top: 7px;
  font-size: 11.5px;
  color: var(--muted);
  line-height: 1.4;
  max-width: 420px;
}

.fallback {
  width: 100%;
  aspect-ratio: 4 / 3;
  border: 1px dashed var(--border-strong);
  border-radius: 6px;
  background: repeating-linear-gradient(45deg, var(--light), var(--light) 8px, #fff 8px, #fff 16px);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 600;
  text-align: center;
  padding: 8px;
}

/* Questions */
.question {
  padding: 22px;
  margin: 0 0 18px;
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: var(--rs);
  background: #fbfdff;
}

.question:first-child {
  border-top: 1px solid var(--border);
  padding-top: 22px;
}

.q-title {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 7px;
  color: var(--text);
}

.q-desc {
  font-size: 15.5px;
  color: var(--muted);
  line-height: 1.65;
  max-width: 68ch;
}

.q-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.na-btn {
  cursor: pointer;
  flex-shrink: 0;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  padding: 7px 12px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  background: white;
  color: var(--muted);
}

.na-btn.active { border-color: var(--ink); background: var(--ink); color: white; }

.scale {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}

.scale.disabled { opacity: .28; pointer-events: none; }

.scale-btn {
  cursor: pointer;
  min-height: 64px;
  padding: 10px 6px;
  border-radius: var(--rs);
  border: 1px solid var(--border);
  background: var(--light);
  color: var(--muted);
  text-align: center;
}

.scale-btn:hover:not(.selected) { border-color: var(--border-strong); background: #fff; }

.scale-btn.selected {
  border: 1px solid var(--accent);
  background: var(--accent);
  color: #ffffff;
  box-shadow: 0 2px 6px rgba(37,99,235,.25);
}

.scale-num { font-family: var(--font-mono); font-size: 19px; font-weight: 700; }
.scale-label { font-size: 12px; margin-top: 4px; }

/* Progress Bar */
.progress-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  width: 100%;
}

.progress-bar {
  flex: 1;
  height: 6px;
  background: var(--light);
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
}

.progress-inner { height: 100%; background: var(--accent); }

.progress-wrap > .label {
  font-family: var(--font-mono);
  background: var(--ink);
  color: #fff;
  border-radius: 4px;
  padding: 4px 8px;
}
.progress-wrap > .label::before { display: none; }

/* Dynamic Flexible Shot Alignment Page Layout */
.shot-focus-grid {
  display: grid;
  grid-template-columns: minmax(300px, .85fr) minmax(420px, 1.15fr);
  gap: 20px;
  align-items: start;
  width: 100%;
}

.shot-focus-media img {
  width: 100%;
  max-height: 350px;
  object-fit: contain;
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--rs);
}

.alignment-text-block {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.alignment-text-block p { margin: 0 0 8px 0; }

.alignment-page {
  min-height: 100vh;
  padding-top: 18px;
  padding-bottom: 18px;
}

.alignment-card {
  width: 100%;
  max-width: none;
  margin: 0;
  padding: 18px 20px;
}

.shot-focus-media {
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}

.alignment-image {
  width: 100%;
  max-height: 350px;
  object-fit: contain;
}

.alignment-copy {
  max-height: 205px;
  overflow-y: auto;
  padding-right: 8px;
}

.alignment-rating-panel {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}

.alignment-rating-panel .question {
  padding: 18px;
  margin-bottom: 12px;
}

.alignment-rating-panel .scale-btn {
  min-height: 48px;
}

.alignment-next {
  align-items: center;
  padding-top: 8px;
}

/* Dynamic Full-Screen Flexible Sequence Stages */
.sequence-stage-layout {
  display: grid;
  grid-template-columns: minmax(0, 3fr) minmax(420px, 2fr);
  gap: 30px;
  align-items: start;
  width: 100%;
  flex: 1;
}

.sequence-sticky-panel {
  position: sticky;
  top: 20px;
  max-height: calc(100vh - 48px);
  overflow-y: auto;
  padding-top: 24px;
  border-top: 3px solid var(--accent);
}

.sequence-sticky-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 10px;
}

.sequence-frame-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
  gap: 10px;
}

.sequence-frame-card {
  background: var(--light);
  border: 1px solid var(--border);
  border-radius: var(--rs);
  padding: 6px;
}

.sequence-frame-img {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: contain;
  background: white;
  border-radius: 6px;
  border: 1px solid var(--border);
}

.sequence-caption {
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.3;
  margin-top: 4px;
  max-height: 2.6em;
  overflow: hidden;
}

.sequence-question-wrap {
  counter-reset: qnum;
  min-width: 0;
}

.sequence-question-wrap > .card {
  padding: 30px;
}

.sequence-question-wrap > .card > .label {
  font-size: 13px;
  color: var(--accent-dark);
}

.sequence-question-wrap > .card > .muted {
  font-size: 16px;
  background: var(--accent-tint);
  border: 1px solid #bfdbfe;
  border-radius: var(--rs);
  padding: 12px 14px;
  margin-bottom: 20px;
}

.sequence-question-wrap .q-title::before {
  content: counter(qnum, decimal-leading-zero) "  \2014  ";
  font-family: var(--font-mono);
  color: var(--accent);
  font-weight: 600;
}

.sequence-question-wrap .question { counter-increment: qnum; }

/* Lightbox */
.zoomable-image-button {
  display: block;
  width: 100%;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: zoom-in;
}

.zoom-hint {
  margin-top: 5px;
  font-size: 10.5px;
  color: var(--muted);
  font-family: var(--font-mono);
}

.lightbox {
  position: fixed;
  inset: 0;
  z-index: 999;
  background: rgba(15,23,42,.9);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.lightbox-inner { position: relative; max-width: min(1400px, 96vw); max-height: 94vh; }
.lightbox img { display: block; max-width: 100%; max-height: 88vh; object-fit: contain; background: #fff; border-radius: 10px; }

.lightbox-close {
  position: absolute;
  right: 0;
  top: -46px;
  border: 1px solid rgba(255,255,255,.4);
  background: rgba(15,23,42,.6);
  color: #fff;
  border-radius: 999px;
  padding: 8px 14px;
  cursor: pointer;
  font-weight: 600;
}


/* Stage-specific evaluation guidance */
.stage-focus-guide {
  margin: 14px 0 18px;
  padding: 14px 16px;
  border-radius: var(--rs);
  border: 1px solid #bfdbfe;
  border-left: 4px solid var(--accent);
  background: var(--accent-tint);
  color: var(--text);
  font-size: 15.5px;
  line-height: 1.65;
}

.stage-focus-guide strong {
  font-weight: 700;
}

.reference-zone {
  margin: 16px 0 22px;
  padding: 14px;
  border: 2px solid #93c5fd;
  border-radius: var(--rs);
  background: #f8fbff;
}

.reference-zone-title,
.generated-zone-title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
}

.reference-zone-note,
.generated-zone-note {
  font-size: 13.5px;
  color: var(--muted);
  line-height: 1.55;
  margin-bottom: 10px;
}

.generated-zone {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 2px solid var(--border-strong);
}

.scene-context {
  margin-top: 12px;
  padding: 13px 14px;
  border-radius: var(--rs);
  border: 1px solid #cbd5e1;
  background: #fff;
}

.scene-context-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
}

.scene-context-row + .scene-context-row {
  margin-top: 8px;
}

.scene-context-label {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--accent-dark);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 2px;
}

.scene-context-text {
  font-size: 14px;
  color: var(--text);
  line-height: 1.55;
}

.character-frame-label {
  margin-top: 5px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  text-align: center;
}

.overall-check-list {
  margin: 8px 0 0;
  padding-left: 20px;
  color: var(--text);
  font-size: 15px;
  line-height: 1.65;
}

.overall-check-list li + li {
  margin-top: 5px;
}

/* Temporal Viewer */
.temporal-viewer {
  margin: 14px 0;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: var(--rs);
  background: var(--light);
}

.temporal-main .sequence-frame-img { aspect-ratio: auto; max-height: 48vh; }

.temporal-counter {
  text-align: center;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--muted);
  margin-top: 6px;
}

.temporal-controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 8px;
}

/* Upgraded Display Check Component */
.visual-test {
  margin-top: 20px;
  border: 1px solid var(--border-strong);
  border-radius: var(--rs);
  padding: 18px;
  background: #fff;
}

.display-strip {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  margin: 12px 0;
  background: #0f172a;
  padding: 8px;
  border-radius: var(--rs);
}

.display-step {
  height: 60px;
  border: 1px solid #334155;
  border-radius: 4px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 4px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: rgba(255,255,255,0.8);
}

.detail-check-scene {
  position: relative;
  height: 170px;
  max-width: 100%;
  margin: 12px 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  background: linear-gradient(to bottom, #e2e8f0 0%, #e2e8f0 46%, #f1f5f9 46%, #f1f5f9 100%);
}

.detail-person { position: absolute; left: 54px; bottom: 22px; width: 74px; height: 118px; }
.detail-head { position: absolute; left: 19px; top: 0; width: 36px; height: 36px; border-radius: 50%; background: #fed7aa; border: 1px solid #fdba74; }
.detail-body { position: absolute; left: 10px; top: 40px; width: 54px; height: 56px; border-radius: 10px 10px 5px 5px; background: #2563eb; border: 1px solid #1d4ed8; }
.detail-glasses { position: absolute; left: 12px; top: 13px; width: 11px; height: 7px; border: 2px solid #0f172a; border-radius: 5px; }
.detail-table { position: absolute; right: 38px; bottom: 34px; width: 128px; height: 14px; border-radius: 4px; background: #64748b; }
.detail-book { position: absolute; right: 72px; bottom: 49px; width: 30px; height: 14px; border-radius: 2px; background: #dc2626; border: 1px solid #b91c1c; }

.visual-test-options {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
  margin-top: 10px;
}

.visual-test-card {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--rs);
  background: var(--light);
  cursor: pointer;
  font-size: 13.5px;
}

.visual-test-card:hover { border-color: var(--border-strong); background: #fff; }
.visual-test-card.active { border-color: var(--accent); background: var(--accent-tint); font-weight: 600; }


/* Main instruction emphasis */
.main-point {
  background: var(--accent-tint);
  border: 1px solid #bfdbfe;
  border-left: 4px solid var(--accent);
  border-radius: var(--rs);
  padding: 14px 16px;
  font-size: 16px;
  line-height: 1.65;
  color: var(--text);
}

.assignment-status {
  margin: 14px 0 18px;
  padding: 14px 16px;
  border-radius: var(--rs);
  border: 1px solid var(--border);
  font-size: 16px;
  line-height: 1.55;
}

.assignment-status.loading {
  background: var(--accent-tint);
  border-color: #bfdbfe;
}

.assignment-status.ready {
  background: var(--ok);
  border-color: #bbf7d0;
  color: var(--oktext);
  font-weight: 700;
}

.assignment-status.full,
.assignment-status.error {
  background: #fef2f2;
  border-color: #fecaca;
  color: var(--danger);
  font-weight: 700;
}


/* Guided evaluation flow */
.plot-first-box {
  max-width: 900px;
  margin: 0 auto;
  padding: 26px;
  border: 1px solid var(--border);
  border-left: 5px solid var(--accent);
  border-radius: var(--r);
  background: #fff;
}

<body><div id="app"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect}=React;

const CONFIG={
  title:"Visual Story Consistency Evaluation",
  institution:"Ritsumeikan University — Visual Information Engineering Lab",
  dataset:"ViStoryBench-Lite",
  surveyVersion:"SPICE-HUMAN-2026-08",

  // Paste the deployed Google Apps Script /exec URL here for the real study.
  googleAppsScriptUrl:"https://script.google.com/macros/s/AKfycbx4L5MXqurxfO-HxUlpPiBQVHCUVP7xpetue5bEkgx6f37Sl8ccRH2sTj3d2Uyx7U6o/exec",

  // true  = final online study: automatically allocate an unused G01-G54.
  // false = local testing: manually enter a test group code.
  requireOnlineSubmission:true,

  autoAllocateGroup:true,
  itemsPerParticipant:6,
  alignmentShotsPerItem:5,
  requireConditionChecklist:true
};

const COMPONENT_QUESTIONS={
  character:[
    {id:"q1_identity",short:"Character identity consistency",desc:"Focus only on character identity. Are the same characters visually consistent in face, body, proportions, and general visual identity across the story?"},
    {id:"q2_attribute",short:"Character attribute consistency",desc:"Focus only on character attributes. Are clothing, colors, accessories, body shape, and other important visual details preserved across shots?"}
  ],
  scene:[
    {id:"q3_background",short:"Background / scene consistency",desc:"Focus only on the environment. When the story stays in the same location, is the background or scene visually consistent?"},
    {id:"q4_temporal",short:"Temporal / sequential continuity",desc:"Focus only on visual continuity across the ordered story. Do characters, scenes, and visual changes progress coherently from one frame to the next?"}
  ],
  overall:[
    {id:"q6_noncopy",short:"Avoidance of repetition / copy-paste",desc:"Focus on repetition. When the story changes, do the images avoid looking overly repeated, duplicated, or copy-pasted?"},
    {id:"q7_overall",short:"Overall visual story consistency",desc:"Considering all previous aspects, how visually consistent and coherent is this generated story overall?"}
  ]
};

const COMPONENT_STAGE_INFO={
  character:{
    label:"Stage 3 / 5",
    title:"Character consistency",
    instruction:"First identify the reference characters, then inspect only how those characters appear across the generated frames.",
    footer:"After this page, you will evaluate background and temporal consistency."
  },
  scene:{
    label:"Stage 4 / 5",
    title:"Scene and temporal consistency",
    instruction:"Inspect the generated sequence in order. Read the plot and setting for context so you can distinguish an intended scene change from an inconsistency.",
    footer:"After this page, you will evaluate repetition and overall consistency."
  },
  overall:{
    label:"Stage 5 / 5",
    title:"Repetition and overall consistency",
    instruction:"Inspect the complete generated sequence again. First check for unnecessary repetition or copy-paste behavior, then judge the visual consistency of the story as a whole.",
    footer:"After this page, your ratings for this story output will be submitted."
  }
};

const SCALE=[{v:1,label:"Very poor"},{v:2,label:"Poor"},{v:3,label:"Fair"},{v:4,label:"Good"},{v:5,label:"Excellent"}];


function onlineReady(){
  return CONFIG.googleAppsScriptUrl &&
    CONFIG.googleAppsScriptUrl.startsWith("https://script.google.com/") &&
    !CONFIG.googleAppsScriptUrl.includes("PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE");
}

function genPID(){
  return "P"+
    Date.now().toString(36).toUpperCase().slice(-7)+
    Math.random().toString(36).slice(2,6).toUpperCase();
}

function getOrCreatePID(){
  const key="spice_participant_id";
  let pid=localStorage.getItem(key);

  if(!pid){
    pid=genPID();
    localStorage.setItem(key,pid);
  }

  return pid;
}

function pad2(n){return String(n).padStart(2,"0")}
function itemKey(item){return item?.itemId||item?.id||""}

function jsonp(url,params={}){
  return new Promise((resolve,reject)=>{
    const callbackName=
      "__spice_cb_"+Date.now()+"_"+Math.random().toString(36).slice(2);

    const timer=setTimeout(()=>{
      cleanup();
      reject(new Error("Assignment server timed out."));
    },15000);

    function cleanup(){
      clearTimeout(timer);
      try{ delete window[callbackName]; }catch(_){}
      if(script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName]=(payload)=>{
      cleanup();
      resolve(payload);
    };

    const qs=new URLSearchParams({
      ...params,
      callback:callbackName
    });

    const script=document.createElement("script");
    script.src=url+(url.includes("?")?"&":"?")+qs.toString();
    script.onerror=()=>{
      cleanup();
      reject(new Error("Could not contact the assignment server."));
    };

    document.head.appendChild(script);
  });
}

async function claimAutomaticGroup(pid,assignments){
  const cached=
    (localStorage.getItem("spice_group_assignment")||"")
      .trim()
      .toUpperCase();

  if(cached && getAssignmentIds(assignments,cached).length){
    return {
      ok:true,
      groupId:cached,
      source:"browser_cache"
    };
  }

  if(!onlineReady()){
    throw new Error("Google Apps Script URL is not configured.");
  }

  const result=await jsonp(
    CONFIG.googleAppsScriptUrl,
    {
      action:"claim",
      pid
    }
  );

  if(result?.ok && result?.groupId){
    const group=String(result.groupId).trim().toUpperCase();

    if(!getAssignmentIds(assignments,group).length){
      throw new Error(
        "The server allocated an assignment that is not present in assignments.json."
      );
    }

    localStorage.setItem("spice_group_assignment",group);

    return {
      ...result,
      groupId:group
    };
  }

  return result||{
    ok:false,
    error:"Assignment server returned no result."
  };
}
function storyBase(item){
  const p=(item?.storyPath||item?.path||"").replace(/\/$/,"");
  return p ? p+"/" : "";
}
function outputBase(item){
  const p=(item?.outputPath||item?.path||"").replace(/\/$/,"");
  return p ? p+"/" : "";
}

function groupReferenceCharacters(characters){
  const groups=[];
  const byName=new Map();

  (characters||[]).forEach((ch,index)=>{
    const name=(ch?.name||`Character ${index+1}`).trim() || `Character ${index+1}`;

    if(!byName.has(name)){
      const group={
        name,
        description:ch?.description||"",
        images:[]
      };
      byName.set(name,group);
      groups.push(group);
    }

    const group=byName.get(name);

    if(!group.description && ch?.description){
      group.description=ch.description;
    }

    if(ch?.ref){
      group.images.push({
        ref:ch.ref,
        alt:`${name} reference ${group.images.length+1}`
      });
    }
  });

  return groups;
}

function ReferenceGroups({item,characters,zoomable=false}){
  const base=storyBase(item);
  const groups=groupReferenceCharacters(characters);

  if(!groups.length){
    return React.createElement(
      "p",
      {className:"muted"},
      "No reference images provided."
    );
  }

  return React.createElement(
    "div",
    {className:"refs"},
    groups.map((group,groupIndex)=>
      React.createElement(
        "section",
        {className:"ref-group",key:`${group.name}-${groupIndex}`},

        React.createElement(
          "div",
          {className:"ref-group-header"},
          React.createElement(
            "div",
            {className:"ref-group-name"},
            group.name
          ),
          React.createElement(
            "div",
            {className:"ref-group-count"},
            `${group.images.length} reference image${group.images.length===1?"":"s"}`
          )
        ),

        React.createElement(
          "div",
          {className:"ref-image-grid"},
          group.images.map((img,i)=>
            React.createElement(
              "div",
              {className:"ref-card",key:`${group.name}-${i}`},
              React.createElement(ImageWithFallback,{
                src:base+img.ref,
                alt:img.alt,
                cls:"ref-img",
                label:"reference",
                zoomable
              })
            )
          )
        ),

        group.description &&
          React.createElement(
            "div",
            {className:"ref-description"},
            group.description
          )
      )
    )
  );
}

function getGroupCodes(assignments){
  if(!assignments) return [];
  if(Array.isArray(assignments)) return assignments.map(x => (x.groupId||x.group_id||x.group||x.code||"").toString().toUpperCase()).filter(Boolean);
  if(assignments.groups && typeof assignments.groups === "object") return Object.keys(assignments.groups).map(x=>x.toUpperCase());
  if(assignments.assignments && typeof assignments.assignments === "object") return Object.keys(assignments.assignments).map(x=>x.toUpperCase());
  return Object.keys(assignments).map(x=>x.toUpperCase());
}

function extractIds(value){
  if(!value) return [];
  if(Array.isArray(value)) return value;
  if(Array.isArray(value.items)) return value.items;
  if(Array.isArray(value.itemIds)) return value.itemIds;
  if(Array.isArray(value.item_ids)) return value.item_ids;
  if(Array.isArray(value.outputs)) return value.outputs;
  if(Array.isArray(value.assignment)) return value.assignment;
  return [];
}

function getAssignmentIds(assignments, group){
  if(!assignments || !group) return [];
  const g = group.toString().trim().toUpperCase();
  if(Array.isArray(assignments)){
    const row = assignments.find(x => ((x.groupId||x.group_id||x.group||x.code||"").toString().trim().toUpperCase()) === g);
    return extractIds(row);
  }
  const source = assignments.groups || assignments.assignments || assignments;
  if(!source || typeof source !== "object") return [];
  const key = Object.keys(source).find(k => k.toString().trim().toUpperCase() === g);
  return key ? extractIds(source[key]) : [];

function buildReferenceFiles(item){
  if(Array.isArray(item.references) && item.references.length){
    return item.references.flatMap(group =>
      (group.files || []).map(file => ({
        character: group.character || "Reference",
        file
      }))
    );
  }

  if(Array.isArray(item.refFiles) && item.refFiles.length){
    return item.refFiles.map(file => ({
      character:"Reference",
      file
    }));
  }

  return [];
}

function normalizeStory(storyData,item){
  const title =
    storyData.title ||
    storyData.story_title ||
    storyData.name ||
    item.title ||
    `Story ${item.storyId}`;

  const summary =
    storyData.summary ||
    storyData.story_summary ||
    storyData.story_all_content_en ||
    storyData.story ||
    storyData.content ||
    "Read the story information and generated frames below.";

  let charText=[];

  if(Array.isArray(storyData.characters)){
    charText=storyData.characters;
  } else if(Array.isArray(storyData.character_info)){
    charText=storyData.character_info;
  } else if(
    storyData.story_all_characters_info &&
    typeof storyData.story_all_characters_info === "object"
  ){
    charText=Object.entries(storyData.story_all_characters_info).map(
      ([name,desc]) => ({
        name,
        description:
          typeof desc === "string"
            ? desc
            : JSON.stringify(desc)
      })
    );
  }

  charText=charText.map((c,i)=>({
    name:
      c.name ||
      c.character_name ||
      `Character ${i+1}`,
    description:
      c.description ||
      c.prompt ||
      c.info ||
      ""
  }));

  const chars=[];

  if(Array.isArray(item.references) && item.references.length){
    item.references.forEach((group,groupIndex)=>{
      const groupName = group.character || `Character ${groupIndex+1}`;

      const textInfo = charText.find(c =>
        String(c.name).trim().toLowerCase() ===
        String(groupName).trim().toLowerCase()
      );

      (group.files || []).forEach((file,fileIndex)=>{
        chars.push({
          name:groupName,
          description:textInfo?.description || "",
          ref:file,
          refIndex:fileIndex
        });
      });
    });
  } else {
    const refs=buildReferenceFiles(item);
    refs.forEach((ref,index)=>{
      chars.push({
        name:ref.character || `Reference ${index+1}`,
        description:"",
        ref:ref.file
      });
    });
  }

  const rawShots =
    storyData.shots ||
    storyData.Shots ||
    storyData.storyboard ||
    [];

  let textShots=[];

  if(Array.isArray(rawShots)){
    textShots=rawShots.map((s,i)=>({
      shotId:
        s.shot_id ||
        s.id ||
        `shot_${pad2(i)}`,
      n:i+1,
      plot:
        s.plot ||
        s.plot_en ||
        s["Plot Correspondence"]?.en ||
        s.shot_plot_correspondence_en ||
        s.caption ||
        s.description ||
        "",
      setting:
        s.setting ||
        s.setting_en ||
        s["Setting Description"]?.en ||
        s.shot_setting_description_en ||
        "",
      staticDesc:
        s.static ||
        s.static_en ||
        s["Static Shot Description"]?.en ||
        s.shot_static_shot_description_en ||
        "",
      characters:
        s.characters ||
        s.character_names ||
        s.characterNames ||
        s.characters_in_shot ||
        s["Characters"] ||
        []
    }));
  }

  // Prefer rich frame records from manifest.json.
  // Missing frames are skipped completely, but each available image
  // still maps to its ORIGINAL story shot via shotNumber.
  const frameRecords =
    Array.isArray(item.frames)
      ? item.frames
      : [];

  let shots=[];

  if(frameRecords.length){
    shots = frameRecords
      .filter(f => !f.missing && f.file)
      .map(f => {
        const originalIndex = Math.max(0, (f.shotNumber || 1) - 1);
        const textShot = textShots[originalIndex] || {};

        return {
          shotId:
            textShot.shotId ||
            `shot_${pad2(f.shotNumber || originalIndex + 1)}`,
          n:f.shotNumber || originalIndex + 1,
          plot:textShot.plot || "",
          setting:textShot.setting || "",
          staticDesc:textShot.staticDesc || "",
          characters:textShot.characters || [],
          frame:f.file
        };
      });
  } else {
    // Backward-compatible fallback for older manifests.
    const frameFiles =
      Array.isArray(item.frameFiles)
        ? item.frameFiles
        : [];

    shots = frameFiles
      .map((frameFile,i)=>({frameFile,i}))
      .filter(x => !!x.frameFile)
      .map(({frameFile,i})=>{
        const textShot=textShots[i] || {};

        return {
          shotId:
            textShot.shotId ||
            `shot_${pad2(i+1)}`,
          n:i+1,
          plot:textShot.plot || "",
          setting:textShot.setting || "",
          staticDesc:textShot.staticDesc || "",
          characters:textShot.characters || [],
          frame:frameFile
        };
      });
  }

  return {
    title,
    summary,
    characters:chars,
    shots
  };
}


function mappingStoryKey(storyId){
  const raw=String(storyId ?? "").trim();
  const m=raw.match(/(\d+)/);
  return m
    ? `story_${pad2(Number(m[1]))}`
    : raw;
}

function validateCharacterMapping(manifest,mapping){
  if(!mapping || typeof mapping!=="object"){
    throw new Error(
      "shot_character_mapping.json could not be loaded."
    );
  }

  const items=Array.isArray(manifest?.items)
    ? manifest.items
    : [];

  if(!items.length){
    throw new Error(
      "manifest.json contains no survey items."
    );
  }

  const checked=new Set();

  items.forEach(item=>{
    const storyKey=mappingStoryKey(item.storyId);

    if(checked.has(storyKey)) return;
    checked.add(storyKey);

    const storyMap=mapping[storyKey];

    if(!storyMap || typeof storyMap!=="object"){
      throw new Error(
        `Verified character mapping is missing ${storyKey}.`
      );
    }

    const expectedFrames=Number(
      item.numFrames ||
      item.expectedFrames ||
      item.frameFiles?.length ||
      item.frames?.length ||
      0
    );

    if(!expectedFrames){
      throw new Error(
        `Cannot determine expected frame count for ${storyKey}.`
      );
    }

    for(let n=1;n<=expectedFrames;n++){
      const shotKey=`shot_${pad2(n)}`;

      if(!Object.prototype.hasOwnProperty.call(storyMap,shotKey)){
        throw new Error(
          `Verified character mapping is missing ${storyKey} / ${shotKey}.`
        );
      }

      if(!Array.isArray(storyMap[shotKey])){
        throw new Error(
          `${storyKey} / ${shotKey} must contain a character-name array.`
        );
      }
    }
  });

  return true;
}

function validateStoryCharacterNames(item,story,mapping){
  const storyKey=mappingStoryKey(item.storyId);
  const storyMap=mapping?.[storyKey]||{};
  const referenceNames=
    groupReferenceCharacters(story.characters)
      .map(g=>g.name);

  const unknown=[];

  Object.entries(storyMap).forEach(([shotKey,names])=>{
    (names||[]).forEach(name=>{
      const exists=referenceNames.some(
        ref=>ref.toLowerCase()===String(name).toLowerCase()
      );

      if(!exists){
        unknown.push(`${shotKey}: ${name}`);
      }
    });
  });

  if(unknown.length){
    throw new Error(
      `Verified character mapping for ${storyKey} contains character name(s) `+
      `that are not available in this story's reference-character list: `+
      unknown.slice(0,8).join(", ")+
      (unknown.length>8?" …":"")
    );
  }

  return true;
}

function buildCharacterComparisonGroups(story,item,mapping){
  const refs=groupReferenceCharacters(story.characters);
  const storyKey=mappingStoryKey(item.storyId);
  const storyMap=mapping?.[storyKey];

  if(!storyMap){
    throw new Error(
      `Verified character mapping is unavailable for ${storyKey}.`
    );
  }

  return refs.map(group=>({
    ...group,
    shots:story.shots.filter(shot=>{
      const shotKey=`shot_${pad2(shot.n)}`;
      const intended=storyMap[shotKey]||[];

      return intended.some(
        name=>
          String(name).toLowerCase()===
          group.name.toLowerCase()
      );
    })
  }));
}

function chooseAlignmentShots(shots,k){
  if(shots.length<=k) return shots;
  if(k<=1) return [shots[0]];
  const idx=[];
  for(let i=0;i<k;i++) idx.push(Math.round(i*(shots.length-1)/(k-1)));
  return [...new Set(idx)].map(i=>shots[i]).slice(0,k);
}

function Alignment({item,story,shots,idx,resp,setResp,onNext}){
  const ik=itemKey(item);
  const shot=shots[idx];
  const key=`align_${shot.shotId}`;
  const r=resp[ik]||{na:[],alignment:{},alignmentNA:[]};
  const val=r.alignment?.[key];
  const isNA=(r.alignmentNA||[]).includes(key);
  const base=outputBase(item);
  const [revealed,setRevealed]=useState(false);

  useEffect(()=>setRevealed(false),[ik,idx]);

  function set(v){
    setResp(p=>{
      const rr={...(p[ik]||{na:[],alignment:{},alignmentNA:[]})};
      rr.alignment={...(rr.alignment||{}),[key]:v};
      rr.alignmentNA=(rr.alignmentNA||[]).filter(x=>x!==key);
      return {...p,[ik]:rr};
    });
  }

  function na(){
    setResp(p=>{
      const rr={...(p[ik]||{na:[],alignment:{},alignmentNA:[]})};
      const a=rr.alignmentNA||[];
      if(a.includes(key)){
        rr.alignmentNA=a.filter(x=>x!==key);
      }else{
        rr.alignmentNA=[...a,key];
        if(rr.alignment) delete rr.alignment[key];
      }
      return {...p,[ik]:rr};
    });

  const complete=typeof val==="number"||isNA;

    if(!group)return;

function SceneStage({item,story,resp,setResp,onNext}){
  const ik=itemKey(item);
  const base=outputBase(item);
  const r=resp[ik]||{na:[]};
  const [idx,setIdx]=useState(0);
  const [seen,setSeen]=useState(()=>new Set());

  useEffect(()=>{
    setIdx(0);
    setSeen(
      story.shots.length
        ? new Set([story.shots[0].shotId])
        : new Set()
    );
  },[ik]);

  const shot=story.shots[idx];

  function rate(qid,v){
    setResp(p=>{
      const rr={...(p[ik]||{na:[]})};
      rr[qid]=v;
      rr.na=(rr.na||[]).filter(x=>x!==qid);
      return {...p,[ik]:rr};
    });
  }

  function inspect(nextIdx){
    const safeIdx=Math.max(
      0,
      Math.min(
        story.shots.length-1,
        nextIdx
      )
    );

    setIdx(safeIdx);

    setSeen(prev=>{
      const next=new Set(prev);
      const target=story.shots[safeIdx];
      if(target) next.add(target.shotId);
      return next;
    });

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });
  }

  const allSeen=
    seen.size>=story.shots.length;

  const complete=
    typeof r.q3_background==="number" &&
    typeof r.q4_temporal==="number";

  return React.createElement(
    "div",
    {className:"page"},

    React.createElement(
      "div",
      {className:"row-between",style:{marginBottom:14}},
      React.createElement(
        "div",
        null,
        React.createElement("div",{className:"label"},"Stage 4 / 5"),

          {style:{marginBottom:0}},
          "Scene and temporal consistency"
        )
      ),

        `Story shot ${shot.n} · ${idx+1}/${story.shots.length}`
      )
    ),

    React.createElement(

function RadarChart({components}){
  const cx=210;
  const cy=210;
  const radius=135;
  const levels=5;
  const count=components.length;

  function pointFor(index,fraction){
    const angle=
      -Math.PI/2+
      (Math.PI*2*index/count);

    return {
      x:cx+Math.cos(angle)*radius*fraction,
      y:cy+Math.sin(angle)*radius*fraction
    };
  }

  function polygonPoints(fraction){
    return components
      .map((_,i)=>{
        const p=pointFor(i,fraction);
        return `${p.x},${p.y}`;
      })
      .join(" ");
  }

  const profilePoints=
    components
      .map((c,i)=>{
        const fraction=
          typeof c.value==="number"
            ? Math.max(
                0,
                Math.min(
                  1,
                  c.value/5
                )
              )
            : 0;

        const p=pointFor(
          i,
          fraction
        );

        return `${p.x},${p.y}`;
      })
      .join(" ");

  return React.createElement(
    "div",
    {className:"radar-shell"},

    React.createElement(
      "div",
      {className:"radar-title"},
      "Your consistency profile"
    ),

    React.createElement(
      "div",
      {className:"radar-subtitle"},
      "The shape summarizes the six consistency components you rated. A profile extending farther outward indicates stronger perceived consistency."
    ),

    React.createElement(
      "svg",
      {
        className:"radar-svg",
        viewBox:"0 0 420 420",
        role:"img",
        "aria-label":"Radar chart of the six visual consistency components"
      },

      Array.from(
        {length:levels},
        (_,i)=>
          React.createElement(
            "polygon",
            {
              key:`grid-${i}`,
              className:"radar-grid",
              points:polygonPoints(
                (i+1)/levels
              )
            }
          )
      ),

      components.map((c,i)=>{
        const p=pointFor(i,1);

        return React.createElement(
          "line",
          {
            key:`axis-${c.key}`,
            className:"radar-axis",
            x1:cx,
            y1:cy,
            x2:p.x,
            y2:p.y
          }
        );
      }),

      React.createElement(
        "polygon",
        {
          className:"radar-profile",
          points:profilePoints
        }
      ),

      components.map((c,i)=>{
        const fraction=
          typeof c.value==="number"
            ? Math.max(
                0,
                Math.min(
                  1,
                  c.value/5
                )
              )
            : 0;

        const p=pointFor(
          i,
          fraction
        );

        return React.createElement(
          "circle",
          {
            key:`point-${c.key}`,
            className:"radar-point",
            cx:p.x,
            cy:p.y,
            r:5
          }
        );
      }),

      components.map((c,i)=>{
        const p=pointFor(i,1.18);

        const anchor=
          Math.abs(p.x-cx)<12
            ? "middle"
            : p.x>cx
              ? "start"
              : "end";

        return React.createElement(
          "text",
          {
            key:`label-${c.key}`,
            className:"radar-label",
            x:p.x,
            y:p.y,
            textAnchor:anchor,
            dominantBaseline:"middle"
          },
          c.shortLabel
        );
      })
    ),

    React.createElement(
      "div",
      {className:"radar-note"},
      "Your direct overall-consistency judgment was recorded before this graphic appeared and is stored separately."
    )
  );
}

function ComponentStage({item,story,stage,resp,setResp,onNext,submitting}) {
  const ik = itemKey(item);
  const r = resp[ik] || {na:[]};
  const questions = COMPONENT_QUESTIONS[stage];
  const info = COMPONENT_STAGE_INFO[stage];
  const isLast = stage === "overall";

  function rate(qid,v) {
    setResp(p => {
      const rr = {...(p[ik] || {na:[]})};
      rr[qid] = v;
      rr.na = (rr.na || []).filter(x => x !== qid);
      return {...p,[ik]:rr};
    });
  }

  function na(qid) {
    setResp(p => {
      const rr = {...(p[ik] || {na:[]})};
      const a = rr.na || [];
      if (a.includes(qid)) { rr.na = a.filter(x => x !== qid); } 
      else { rr.na = [...a,qid]; delete rr[qid]; }
      return {...p,[ik]:rr};
    });
  }

  const complete = questions.every(q => typeof r[q.id] === "number" || (r.na || []).includes(q.id));

  return React.createElement("div",{className:"page"},
    React.createElement("div",{className:"sequence-stage-layout"},
      React.createElement(SequencePanel, {
        item,
        story,
        title:info.title,
        instruction:info.instruction,
        stage,
        showReferences:stage === "character",
        showTemporalViewer:stage === "scene"
      }),
      React.createElement("div",{className:"sequence-question-wrap"},
        React.createElement("div",{className:"card"},
          React.createElement("div",{className:"label",style:{marginBottom:6}},info.label),
          React.createElement("p",{className:"muted",style:{marginTop:0}},info.footer),
          questions.map(q => React.createElement(Q, {
            key:q.id,
            q,
            val:r[q.id],
            isNA:(r.na || []).includes(q.id),
            onRate:v=>rate(q.id,v),
            onNA:()=>na(q.id)
          })),
          React.createElement("div",{className:"row-between",style:{borderTop:"1px solid var(--border)",paddingTop:16,marginTop:12}},
            React.createElement("span",{className:"muted"},complete ? "" : "Please answer all questions or select N/A."),
            btn(true,!complete || submitting,onNext,submitting ? "Submitting..." : (isLast ? "Finish story" : "Continue"))
          )
        )
      )
    )
  );
}

        React.createElement(
          "div",
          {className:"q-title"},
          "Which single component do you consider the most important?"
        ),

        React.createElement(
          "div",
          {className:"q-desc"},
          "Choose the one component that contributes most strongly to your judgment of whether a generated visual story is consistent."
        ),

        React.createElement(
          "select",
          {
            value:mostImportant,
            onChange:e=>
              setMostImportant(
                e.target.value
              ),
            style:{
              marginTop:14,
              width:"100%",
              maxWidth:620
            }
          },

          React.createElement(
            "option",
            {value:""},
            "Select one component"
          ),

          IMPORTANCE_COMPONENTS.map(
            c=>
              React.createElement(
                "option",
                {
                  key:c.key,
                  value:c.key
                },
                c.label
              )
          )
        )
      ),

      React.createElement(
        "div",
        {
          className:"question",
          style:{marginTop:18}
        },

        React.createElement(
          "div",
          {className:"q-title"},
          "How important is each component to your overall consistency judgment?"
        ),

        React.createElement(
          "div",
          {className:"q-desc"},
          "Rate each component independently from 1 to 5. You do not need to compare totals or make the ratings add up to anything."
        ),

        React.createElement(
          "div",
          {className:"importance-rating-list"},

          IMPORTANCE_COMPONENTS.map(
            c=>
              React.createElement(
                "div",
                {
                  className:"importance-rating-row",
                  key:c.key
                },

                React.createElement(
                  "div",
                  {className:"importance-rating-name"},
                  c.label
                ),

                React.createElement(
                  "div",
                  {className:"importance-mini-scale"},

                  IMPORTANCE_SCALE.map(
                    s=>
                      React.createElement(
                        "button",
                        {
                          type:"button",
                          key:s.v,
                          className:
                            "importance-mini-btn"+
                            (
                              ratings[c.key]===s.v
                                ? " selected"
                                : ""
                            ),
                          onClick:()=>
                            updateRating(
                              c.key,
                              s.v
                            )
                        },

                        React.createElement(
                          "div",
                          {className:"importance-mini-num"},
                          s.v
                        ),

                        React.createElement(
                          "div",
                          {className:"importance-mini-label"},
                          s.label
                        )
                      )
                  )
                )
              )
          )
        )
      ),

      React.createElement(
        "div",
        {
          className:"row-between",
          style:{
            borderTop:
              "1px solid var(--border)",
            marginTop:20,
            paddingTop:18
          }
        },

        React.createElement(
          "span",
          {className:"muted"},
          valid
            ? ""
            : "Choose one most-important component and rate all six components."
        ),

        btn(
          true,
          !valid||submitting,
          ()=>onSubmit({
            mostImportant,
            ratings
          }),
          submitting
            ? "Submitting..."
            : "Submit final response"
        )
      )
    )
  );
}

function Done({pid,status}){
  return React.createElement(
    "div",
    {className:"page"},
    React.createElement(
      "div",
      {
        className:"card",
        style:{
          textAlign:"center",
          padding:"48px 24px"
        }
      },
      React.createElement(
        "h2",
        null,
        "Thank you for your participation"
      ),
      React.createElement(
        "p",
        {className:"muted"},
        status==="local_only"
          ? "This was local test mode. Your responses were saved only in this browser."
          : "Your responses have been successfully submitted."
      )
    )
  );
}
function RuntimeError({message,onBack}){
  return React.createElement("div",{className:"page"},
    React.createElement("div",{className:"card"},
      React.createElement("h2",null,"Unable to load evaluation item"),
      React.createElement("div",{className:"error"},message),
      React.createElement("p",{className:"muted"},"Please verify group IDs, storyPath, storyFile, outputPath, references/refFiles, frameFiles in manifest.json, and assignments.json."),
      btn(false,false,onBack,"Back to setup")
    )
  );
}

function App(){
  const[phase,setPhase]=useState("loading");
  const[manifest,setManifest]=useState(null);
  const[assign,setAssign]=useState(null);
  const[characterMapping,setCharacterMapping]=useState(null);
  const[err,setErr]=useState("");
  const[pid,setPid]=useState("");
  const[meta,setMeta]=useState(null);
  const[items,setItems]=useState([]);
  const[itemIdx,setItemIdx]=useState(0);
  const[story,setStory]=useState(null);
  const[alignShots,setAlignShots]=useState([]);
  const[alignIdx,setAlignIdx]=useState(0);
  const[resp,setResp]=useState({});
  const[submitting,setSubmitting]=useState(false);
  const[status,setStatus]=useState("sent");
  const[componentImportance,setComponentImportance]=useState(null);

  useEffect(()=>{
    Promise.all([
      getJson("data/manifest.json"),
      getJson("data/assignments.json"),
      getJson("data/shot_character_mapping.json")
    ])
      .then(([m,a,c])=>{
        validateCharacterMapping(m,c);
        setManifest(m);
        setAssign(a);
        setCharacterMapping(c);
        setPhase("welcome");
      })
      .catch(e=>{
        setErr(String(e));
        setPhase("welcome");
      })
  },[]);

  async function loadItem(i,itemList=items){
    try{
      const item=itemList[i];

      if(!item){
        throw new Error(
          "No item found. Please verify assignments.json, manifest.json, and shot_character_mapping.json."
        );
      }

      const storyFile = item.storyFile || "story.json";
      const storyUrl = storyBase(item) + storyFile;

      const storyData = await getJson(storyUrl);
      const st = normalizeStory(storyData,item);

      validateStoryCharacterNames(
        item,
        st,
        characterMapping
      );

      if(!st.shots.length){
        throw new Error(
          `No generated frames were listed for ${item.itemId}. Check frameFiles in manifest.json.`
        );
      }

      setStory(st);
      setAlignShots(
        chooseAlignmentShots(
          st.shots,
          CONFIG.alignmentShotsPerItem
        )
      );
      setAlignIdx(0);
      setPhase("intro");

    }catch(e){
      console.error(e);
      setErr(String(e));
      setPhase("runtime_error");
    }
  }

  function start(){
    setPid(getOrCreatePID());
    setPhase("consent");
  }

  async function setupDone(m){
    setMeta(m);
    const ids=getAssignmentIds(assign,m.groupId);
    const itemObjs=ids.map(id=>(manifest.items||[]).find(x=>x.itemId===id)).filter(Boolean);
    if(!itemObjs.length){
      setErr(`Group ${m.groupId} has no valid items listed in manifest.json.`);
      setPhase("runtime_error");
      return;
    }
    setItems(itemObjs);
    setItemIdx(0);
    await loadItem(0,itemObjs);
  }

  function nextIntro(){setPhase("alignment")}
  function nextAlign(){if(alignIdx<alignShots.length-1)setAlignIdx(alignIdx+1);else setPhase("character")}
  function averageAlignment(r){
    const vals=Object.values(r.alignment||{}).filter(v=>typeof v==="number");
    return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:"";
  }

  function averageCharacterRating(r,field){
    const vals=Object.values(r.characterRatings||{})
      .map(x=>x?.[field])
      .filter(v=>typeof v==="number");
    return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:"";
  }

  function componentBasedScore(r){
    const values=[
      averageCharacterRating(r,"identity"),
      averageCharacterRating(r,"attribute"),
      r.q3_background,
      r.q4_temporal,
      averageAlignment(r),
      r.q6_noncopy
    ].filter(v=>typeof v==="number");

    return values.length
      ? values.reduce((a,b)=>a+b,0)/values.length
      : "";
  }

  async function finishSeq(){
    const item=items[itemIdx];
    const ik=itemKey(item);
    const itemResp=resp[ik]||{};
    const submission={
      submissionType:"sequence_rating",
      surveyVersion:CONFIG.surveyVersion,
      dataset:CONFIG.dataset,
      pid,
      groupId:meta.groupId,
      timestamp:new Date().toISOString(),
      participantMeta:meta,
      itemIndex:itemIdx+1,
      totalItems:items.length,
      itemMeta:item,
      responses:{
        [ik]:{
          ...itemResp,
          q1_identity:averageCharacterRating(itemResp,"identity"),
          q2_attribute:averageCharacterRating(itemResp,"attribute"),
          q5_alignment:averageAlignment(itemResp),
          component_based_score:componentBasedScore(itemResp)
        }
      }
    };
    setSubmitting(true);
    try{
      const result=await submit(submission);
      setStatus(result.status||"sent")
    }catch(e){
      console.error(e);
      setStatus("error")
    }
    setSubmitting(false);
    if(itemIdx<items.length-1){
      const ni=itemIdx+1;
      setItemIdx(ni);
      await loadItem(ni,items);
    }else{
      setPhase("importance");
    }
  }

  async function finishSession(importance){
    setComponentImportance(importance);
    setSubmitting(true);

    const completion={
      submissionType:"session_complete",
      surveyVersion:CONFIG.surveyVersion,
      dataset:CONFIG.dataset,
      pid,
      groupId:meta.groupId,
      timestamp:new Date().toISOString(),
      participantMeta:meta,
      completedItems:items.length,
      componentImportance:importance
    };

    try{
      const finalResult=
        await submit(completion);

      if(finalResult.status){
        setStatus(finalResult.status);
      }

      localStorage.setItem(
        "spice_study_completed",
        "true"
      );

      setPhase("done");

    }catch(e){
      console.error(e);
      setStatus("error");
    }

    setSubmitting(false);
  }

  if(phase==="loading")return React.createElement("div",{className:"page"},React.createElement("div",{className:"card"},"Loading..."));
  const cur=items[itemIdx];
  return React.createElement("div",null,
    phase==="welcome"&&React.createElement(Welcome,{start,loadError:err}),
    phase==="consent"&&React.createElement(Consent,{onGo:()=>setPhase("setup")}),
    phase==="setup"&&React.createElement(Setup,{assignments:assign||{},pid,onGo:setupDone}),
    phase==="intro"&&story&&React.createElement(Intro,{item:cur,story,onNext:nextIntro,itemNo:itemIdx+1,total:items.length}),
    phase==="alignment"&&story&&React.createElement(Alignment,{item:cur,story,shots:alignShots,idx:alignIdx,resp,setResp,onNext:nextAlign}),
    phase==="character"&&story&&React.createElement(CharacterStage,{item:cur,story,characterMapping,resp,setResp,onNext:()=>setPhase("scene")}),
    phase==="scene"&&story&&React.createElement(SceneStage,{item:cur,story,resp,setResp,onNext:()=>setPhase("overall")}),
    phase==="overall"&&story&&React.createElement(OverallStage,{item:cur,story,resp,setResp,onNext:finishSeq,submitting}),
    phase==="importance"&&React.createElement(ComponentImportance,{onSubmit:finishSession,submitting}),
    phase==="done"&&React.createElement(Done,{pid,status}),
    phase==="runtime_error"&&React.createElement(RuntimeError,{message:err,onBack:()=>setPhase("setup")})
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(React.createElement(App));
</script>
</body>
</html>
