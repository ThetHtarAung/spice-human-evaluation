<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Visual Story Consistency Human Evaluation</title>
<style>

* {
  box-sizing: border-box;
}

:root {
  /* Clean White & Dark Blue Color Palette */
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #0f172a;       /* Dark Navy */
  --muted: #64748b;      /* Cool Slate Gray */
  --light: #f1f5f9;      /* Light Cool Gray */
  --border: #e2e8f0;     /* Soft Border */
  --border-strong: #cbd5e1;
  --ink: #0f172a;        /* Deep Slate/Navy */
  --accent: #2563eb;     /* Vivid Blue */
  --accent-dark: #1d4ed8;
  --accent-tint: #eff6ff;/* Soft Blue Tint */
  --danger: #dc2626;
  --warn: #fef3c7;
  --warntext: #92400e;
  --ok: #dcfce7;
  --oktext: #166534;
  --r: 12px;
  --rs: 8px;
  --font-display: Arial, Helvetica, sans-serif;
  --font-body: Arial, Helvetica, sans-serif;
  --font-mono: Arial, Helvetica, sans-serif;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

button, input, select {
  font-family: inherit;
}

button {
  transition: background-color .15s ease, border-color .15s ease, transform .05s ease, color .15s ease;
}

button:active:not(:disabled) {
  transform: translateY(1px);
}

button:disabled {
  cursor: not-allowed;
  opacity: .4;
}

button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

input[type=checkbox], input[type=radio] {
  accent-color: var(--accent);
  width: 16px;
  height: 16px;
}

input[type=text], select, textarea {
  width: 100%;
  padding: 11px 13px;
  border-radius: var(--rs);
  border: 1px solid var(--border-strong);
  background: #fff;
  color: var(--text);
  font-size: 14px;
  outline: none;
}

textarea {
  min-height: 110px;
  resize: vertical;
  line-height: 1.55;
}

input[type=text]:focus, select:focus, textarea:focus {
  border-color: var(--accent);
}

/* Full Screen Flexible Page Layout */
.page {
  width: 100%;
  min-height: 100vh;
  margin: 0;
  padding: 28px;
  display: flex;
  flex-direction: column;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 28px;
  box-shadow: 0 1px 3px rgba(15,23,42,.04), 0 10px 25px -15px rgba(15,23,42,.08);
  width: 100%;
}

.card + .card {
  margin-top: 16px;
}

.label {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .08em;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.label::before {
  content: "";
  display: inline-block;
  width: 10px;
  height: 2px;
  background: var(--accent);
  flex-shrink: 0;
}

h1 {
  font-family: var(--font-display);
  font-size: 34px;
  margin: 6px 0 12px;
  font-weight: 700;
  letter-spacing: -.02em;
  color: var(--text);
  line-height: 1.2;
}

h2 {
  font-family: var(--font-display);
  font-size: 27px;
  margin: 6px 0 12px;
  font-weight: 700;
  letter-spacing: -.01em;
  color: var(--text);
  line-height: 1.25;
}

h3 {
  font-family: var(--font-display);
  font-size: 19px;
  margin: 0 0 8px;
  font-weight: 600;
  color: var(--text);
}

p { line-height: 1.6; }

.muted {
  color: var(--muted);
  font-size: 16px;
  line-height: 1.7;
}

.btn-primary {
  cursor: pointer;
  padding: 11px 24px;
  border-radius: var(--rs);
  border: 1px solid var(--accent-dark);
  background: var(--accent);
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .01em;
  box-shadow: 0 1px 2px rgba(37,99,235,.2);
}

.btn-primary:hover:not(:disabled) { 
  background: var(--accent-dark); 
}

.btn-secondary {
  cursor: pointer;
  padding: 11px 20px;
  border-radius: var(--rs);
  border: 1px solid var(--border-strong);
  background: #fff;
  color: var(--text);
  font-size: 16px;
  font-weight: 700;
}

.btn-secondary:hover:not(:disabled) { 
  border-color: var(--ink); 
  background: var(--light);
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.row-between {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}

.notice, .success, .error {
  border-radius: var(--rs);
  padding: 13px 15px;
  font-size: 13px;
  line-height: 1.55;
}

.notice { background: var(--warn); color: var(--warntext); border: 1px solid #fde68a; }
.success { background: var(--ok); color: var(--oktext); border: 1px solid #bbf7d0; }
.error { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }

.stat {
  background: var(--light);
  border: 1px solid var(--border);
  border-radius: var(--rs);
  padding: 16px 14px;
  text-align: center;
}

.stat-number {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 600;
  color: var(--ink);
}

.stat-label {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--muted);
  text-transform: uppercase;
  margin-top: 3px;
}

/* Reference Images — grouped by character */
.refs {
  display: flex;
  flex-wrap: wrap;
  gap: 22px 28px;
  width: 100%;
  align-items: flex-start;
}

.ref-group {
  min-width: 220px;
  max-width: 420px;
  flex: 1 1 280px;
  padding: 0;
  background: transparent;
  border: 0;
}

.ref-group-header {
  display: flex;
  align-items: baseline;
  justify-content: flex-start;
  gap: 10px;
  margin-bottom: 7px;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--border);
}

.ref-group-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}

.ref-group-count {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
  white-space: nowrap;
}

.ref-image-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  width: 100%;
}

.ref-card {
  width: 130px;
  min-width: 130px;
  background: transparent;
  border: 0;
  padding: 0;
}

.ref-img {
  width: 130px;
  height: 130px;
  object-fit: contain;
  background: white;
  border-radius: 5px;
  border: 1px solid var(--border);
}

.ref-description {
  margin-top: 7px;
  font-size: 11.5px;
  color: var(--muted);
  line-height: 1.4;
  max-width: 420px;
}

.fallback {
  width: 100%;
  aspect-ratio: 4 / 3;
  border: 1px dashed var(--border-strong);
  border-radius: 6px;
  background: repeating-linear-gradient(45deg, var(--light), var(--light) 8px, #fff 8px, #fff 16px);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 600;
  text-align: center;
  padding: 8px;
}

/* Questions */
.question {
  padding: 22px;
  margin: 0 0 18px;
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: var(--rs);
  background: #fbfdff;
}

.question:first-child {
  border-top: 1px solid var(--border);
  padding-top: 22px;
}

.q-title {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 7px;
  color: var(--text);
}

.q-desc {
  font-size: 15.5px;
  color: var(--muted);
  line-height: 1.65;
  max-width: 68ch;
}

.q-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.na-btn {
  cursor: pointer;
  flex-shrink: 0;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  padding: 7px 12px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  background: white;
  color: var(--muted);
}

.na-btn.active { border-color: var(--ink); background: var(--ink); color: white; }

.scale {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}

.scale.disabled { opacity: .28; pointer-events: none; }

.scale-btn {
  cursor: pointer;
  min-height: 64px;
  padding: 10px 6px;
  border-radius: var(--rs);
  border: 1px solid var(--border);
  background: var(--light);
  color: var(--muted);
  text-align: center;
}

.scale-btn:hover:not(.selected) { border-color: var(--border-strong); background: #fff; }

.scale-btn.selected {
  border: 1px solid var(--accent);
  background: var(--accent);
  color: #ffffff;
  box-shadow: 0 2px 6px rgba(37,99,235,.25);
}

.scale-num { font-family: var(--font-mono); font-size: 19px; font-weight: 700; }
.scale-label { font-size: 12px; margin-top: 4px; }

/* Progress Bar */
.progress-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  width: 100%;
}

.progress-bar {
  flex: 1;
  height: 6px;
  background: var(--light);
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
}

.progress-inner { height: 100%; background: var(--accent); }

.progress-wrap > .label {
  font-family: var(--font-mono);
  background: var(--ink);
  color: #fff;
  border-radius: 4px;
  padding: 4px 8px;
}
.progress-wrap > .label::before { display: none; }

/* Dynamic Flexible Shot Alignment Page Layout */
.shot-focus-grid {
  display: grid;
  grid-template-columns: minmax(300px, .85fr) minmax(420px, 1.15fr);
  gap: 20px;
  align-items: start;
  width: 100%;
}

.shot-focus-media img {
  width: 100%;
  max-height: 350px;
  object-fit: contain;
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--rs);
}

.alignment-text-block {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.alignment-text-block p { margin: 0 0 8px 0; }

.alignment-page {
  min-height: 100vh;
  padding-top: 18px;
  padding-bottom: 18px;
}

.alignment-card {
  width: 100%;
  max-width: none;
  margin: 0;
  padding: 18px 20px;
}

.shot-focus-media {
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}

.alignment-image {
  width: 100%;
  max-height: 520px;
  object-fit: contain;
}

.alignment-copy {
  max-height: 205px;
  overflow-y: auto;
  padding-right: 8px;
}

.alignment-rating-panel {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}

.alignment-rating-panel .question {
  padding: 18px;
  margin-bottom: 12px;
}

.alignment-rating-panel .scale-btn {
  min-height: 48px;
}

.alignment-next {
  align-items: center;
  padding-top: 8px;
}

/* Dynamic Full-Screen Flexible Sequence Stages */
.sequence-stage-layout {
  display: grid;
  grid-template-columns: minmax(0, 3fr) minmax(420px, 2fr);
  gap: 30px;
  align-items: start;
  width: 100%;
  flex: 1;
}

.sequence-sticky-panel {
  position: sticky;
  top: 20px;
  max-height: calc(100vh - 48px);
  overflow-y: auto;
  padding-top: 24px;
  border-top: 3px solid var(--accent);
}

.sequence-sticky-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 10px;
}

.sequence-frame-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 10px;
}

.sequence-frame-card {
  background: var(--light);
  border: 1px solid var(--border);
  border-radius: var(--rs);
  padding: 6px;
}

.sequence-frame-img {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: contain;
  background: white;
  border-radius: 6px;
  border: 1px solid var(--border);
}

.sequence-caption {
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.3;
  margin-top: 4px;
  max-height: 2.6em;
  overflow: hidden;
}

.sequence-question-wrap {
  counter-reset: qnum;
  min-width: 0;
}

.sequence-question-wrap > .card {
  padding: 30px;
}

.sequence-question-wrap > .card > .label {
  font-size: 13px;
  color: var(--accent-dark);
}

.sequence-question-wrap > .card > .muted {
  font-size: 16px;
  background: var(--accent-tint);
  border: 1px solid #bfdbfe;
  border-radius: var(--rs);
  padding: 12px 14px;
  margin-bottom: 20px;
}

.sequence-question-wrap .q-title::before {
  content: counter(qnum, decimal-leading-zero) "  \2014  ";
  font-family: var(--font-mono);
  color: var(--accent);
  font-weight: 600;
}

.sequence-question-wrap .question { counter-increment: qnum; }

/* Lightbox */
.zoomable-image-button {
  display: block;
  width: 100%;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: zoom-in;
}

.zoom-hint {
  margin-top: 5px;
  font-size: 10.5px;
  color: var(--muted);
  font-family: var(--font-mono);
}

.lightbox {
  position: fixed;
  inset: 0;
  z-index: 999;
  background: rgba(15,23,42,.9);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.lightbox-inner { position: relative; max-width: min(1400px, 96vw); max-height: 94vh; }
.lightbox img { display: block; max-width: 100%; max-height: 88vh; object-fit: contain; background: #fff; border-radius: 10px; }

.lightbox-close {
  position: absolute;
  right: 0;
  top: -46px;
  border: 1px solid rgba(255,255,255,.4);
  background: rgba(15,23,42,.6);
  color: #fff;
  border-radius: 999px;
  padding: 8px 14px;
  cursor: pointer;
  font-weight: 600;
}


/* Stage-specific evaluation guidance */
.stage-focus-guide {
  margin: 14px 0 18px;
  padding: 14px 16px;
  border-radius: var(--rs);
  border: 1px solid #bfdbfe;
  border-left: 4px solid var(--accent);
  background: var(--accent-tint);
  color: var(--text);
  font-size: 15.5px;
  line-height: 1.65;
}

.stage-focus-guide strong {
  font-weight: 700;
}

.reference-zone {
  margin: 16px 0 22px;
  padding: 14px;
  border: 2px solid #93c5fd;
  border-radius: var(--rs);
  background: #f8fbff;
}

.reference-zone-title,
.generated-zone-title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
}

.reference-zone-note,
.generated-zone-note {
  font-size: 13.5px;
  color: var(--muted);
  line-height: 1.55;
  margin-bottom: 10px;
}

.generated-zone {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 2px solid var(--border-strong);
}

.scene-context {
  margin-top: 12px;
  padding: 13px 14px;
  border-radius: var(--rs);
  border: 1px solid #cbd5e1;
  background: #fff;
}

.scene-context-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
}

.scene-context-row + .scene-context-row {
  margin-top: 8px;
}

.scene-context-label {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--accent-dark);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 2px;
}

.scene-context-text {
  font-size: 14px;
  color: var(--text);
  line-height: 1.55;
}

.character-frame-label {
  margin-top: 5px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  text-align: center;
}

.overall-check-list {
  margin: 8px 0 0;
  padding-left: 20px;
  color: var(--text);
  font-size: 15px;
  line-height: 1.65;
}

.overall-check-list li + li {
  margin-top: 5px;
}

/* Temporal Viewer */
.temporal-viewer {
  margin: 14px 0;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: var(--rs);
  background: var(--light);
}

.temporal-main .sequence-frame-img { aspect-ratio: auto; max-height: 48vh; }

.temporal-counter {
  text-align: center;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--muted);
  margin-top: 6px;
}

.temporal-controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 8px;
}

/* Upgraded Display Check Component */
.visual-test {
  margin-top: 20px;
  border: 1px solid var(--border-strong);
  border-radius: var(--rs);
  padding: 18px;
  background: #fff;
}

.display-strip {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  margin: 12px 0;
  background: #0f172a;
  padding: 8px;
  border-radius: var(--rs);
}

.display-step {
  height: 60px;
  border: 1px solid #334155;
  border-radius: 4px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 4px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: rgba(255,255,255,0.8);
}

.detail-check-scene {
  position: relative;
  height: 170px;
  max-width: 100%;
  margin: 12px 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  background: linear-gradient(to bottom, #e2e8f0 0%, #e2e8f0 46%, #f1f5f9 46%, #f1f5f9 100%);
}

.detail-person { position: absolute; left: 54px; bottom: 22px; width: 74px; height: 118px; }
.detail-head { position: absolute; left: 19px; top: 0; width: 36px; height: 36px; border-radius: 50%; background: #fed7aa; border: 1px solid #fdba74; }
.detail-body { position: absolute; left: 10px; top: 40px; width: 54px; height: 56px; border-radius: 10px 10px 5px 5px; background: #2563eb; border: 1px solid #1d4ed8; }
.detail-glasses { position: absolute; left: 12px; top: 13px; width: 11px; height: 7px; border: 2px solid #0f172a; border-radius: 5px; }
.detail-table { position: absolute; right: 38px; bottom: 34px; width: 128px; height: 14px; border-radius: 4px; background: #64748b; }
.detail-book { position: absolute; right: 72px; bottom: 49px; width: 30px; height: 14px; border-radius: 2px; background: #dc2626; border: 1px solid #b91c1c; }

.visual-test-options {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
  margin-top: 10px;
}

.visual-test-card {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--rs);
  background: var(--light);
  cursor: pointer;
  font-size: 13.5px;
}

.visual-test-card:hover { border-color: var(--border-strong); background: #fff; }
.visual-test-card.active { border-color: var(--accent); background: var(--accent-tint); font-weight: 600; }


/* Main instruction emphasis */
.main-point {
  background: var(--accent-tint);
  border: 1px solid #bfdbfe;
  border-left: 4px solid var(--accent);
  border-radius: var(--rs);
  padding: 14px 16px;
  font-size: 16px;
  line-height: 1.65;
  color: var(--text);
}

.assignment-status {
  margin: 14px 0 18px;
  padding: 14px 16px;
  border-radius: var(--rs);
  border: 1px solid var(--border);
  font-size: 16px;
  line-height: 1.55;
}

.assignment-status.loading {
  background: var(--accent-tint);
  border-color: #bfdbfe;
}

.assignment-status.ready {
  background: var(--ok);
  border-color: #bbf7d0;
  color: var(--oktext);
  font-weight: 700;
}

.assignment-status.full,
.assignment-status.error {
  background: #fef2f2;
  border-color: #fecaca;
  color: var(--danger);
  font-weight: 700;
}


/* Guided evaluation flow */
.plot-first-box {
  max-width: 900px;
  margin: 0 auto;
  padding: 26px;
  border: 1px solid var(--border);
  border-left: 5px solid var(--accent);
  border-radius: var(--r);
  background: #fff;
}

.plot-first-box .plot-text {
  font-size: 19px;
  line-height: 1.75;
  color: var(--text);
  margin: 10px 0 18px;
}

.reveal-button-wrap {
  display: flex;
  justify-content: center;
  margin-top: 18px;
}

.guided-split {
  display: grid;
  grid-template-columns: minmax(0,3fr) minmax(420px,2fr);
  gap: 30px;
  align-items: start;
}

function onlineReady(){
  const url = String(CONFIG.googleAppsScriptUrl || "").trim();
  return url.startsWith("https://script.google.com/macros/s/") &&
         url.endsWith("/exec");
}

function genPID(){
  return "P"+
    Date.now().toString(36).toUpperCase().slice(-7)+
    Math.random().toString(36).slice(2,6).toUpperCase();
}

function getOrCreatePID(){
  const key="spice_participant_id";
  let pid=localStorage.getItem(key);

  // During pilot testing only, start a genuinely new participant session
  // after the previous session was confirmed saved to Google Sheets.
  if(
    CONFIG.allowRepeatPilotSessions &&
    localStorage.getItem("spice_study_completed")==="true"
  ){
    pid=genPID();
    localStorage.setItem(key,pid);
    localStorage.removeItem("spice_study_completed");
  }

  if(!pid){
    pid=genPID();
    localStorage.setItem(key,pid);
  }

  return pid;
}

function pad2(n){return String(n).padStart(2,"0")}
function itemKey(item){return item?.itemId||item?.id||""}

function jsonp(url,params={}){
  return new Promise((resolve,reject)=>{
    const callbackName=
      "__spice_cb_"+Date.now()+"_"+Math.random().toString(36).slice(2);

    const timer=setTimeout(()=>{
      cleanup();
      reject(new Error("Assignment server timed out."));
    },15000);

    function cleanup(){
      clearTimeout(timer);
      try{ delete window[callbackName]; }catch(_){}
      if(script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName]=(payload)=>{
      cleanup();
      resolve(payload);
    };

    const qs=new URLSearchParams({
      ...params,
      callback:callbackName
    });

    const script=document.createElement("script");
    script.src=url+(url.includes("?")?"&":"?")+qs.toString();
    script.onerror=()=>{
      cleanup();
      reject(new Error("Could not contact the assignment server."));
    };

    document.head.appendChild(script);
  });
}

async function claimAutomaticGroup(pid,assignments){
  if(!onlineReady()){
    throw new Error("Google Apps Script URL is not configured.");
  }

  // Always ask the server.
  // Google Sheets / Apps Script is the source of truth for assignment.
  const result=await jsonp(
    CONFIG.googleAppsScriptUrl,
    {
      action:"claim",
      pid
    }
  );

  if(result?.ok && result?.groupId){
    const group=String(result.groupId).trim().toUpperCase();

    if(!getAssignmentIds(assignments,group).length){
      throw new Error(
        "The server allocated an assignment that is not present in assignments.json."
      );
    }

    return {
      ...result,
      groupId:group,
      source:"server"
    };
  }

  return result||{
    ok:false,
    error:"Assignment server returned no result."
  };
}

  const p=(item?.storyPath||item?.path||"").replace(/\/$/,"");
  return p ? p+"/" : "";
}
function outputBase(item){
  const p=(item?.outputPath||item?.path||"").replace(/\/$/,"");
  return p ? p+"/" : "";
}

function groupReferenceCharacters(characters){
  const groups=[];
  const byName=new Map();

  (characters||[]).forEach((ch,index)=>{
    const name=(ch?.name||`Character ${index+1}`).trim() || `Character ${index+1}`;

    if(!byName.has(name)){
      const group={
        name,
        description:ch?.description||"",
        images:[]
      };
      byName.set(name,group);
      groups.push(group);
    }

    const group=byName.get(name);

    if(!group.description && ch?.description){
      group.description=ch.description;
    }

    if(ch?.ref){
      group.images.push({
        ref:ch.ref,
        alt:`${name} reference ${group.images.length+1}`
      });
    }
  });

  return groups;
}

}

function getGroupCodes(assignments){
  if(!assignments) return [];
  if(Array.isArray(assignments)) return assignments.map(x => (x.groupId||x.group_id||x.group||x.code||"").toString().toUpperCase()).filter(Boolean);
  if(assignments.groups && typeof assignments.groups === "object") return Object.keys(assignments.groups).map(x=>x.toUpperCase());
  if(assignments.assignments && typeof assignments.assignments === "object") return Object.keys(assignments.assignments).map(x=>x.toUpperCase());
  return Object.keys(assignments).map(x=>x.toUpperCase());
}

function extractIds(value){
  if(!value) return [];
  if(Array.isArray(value)) return value;
  if(Array.isArray(value.items)) return value.items;
  if(Array.isArray(value.itemIds)) return value.itemIds;
  if(Array.isArray(value.item_ids)) return value.item_ids;
  if(Array.isArray(value.outputs)) return value.outputs;
  if(Array.isArray(value.assignment)) return value.assignment;
  return [];
}

function getAssignmentIds(assignments, group){
  if(!assignments || !group) return [];
  const g = group.toString().trim().toUpperCase();
  if(Array.isArray(assignments)){
    const row = assignments.find(x => ((x.groupId||x.group_id||x.group||x.code||"").toString().trim().toUpperCase()) === g);
    return extractIds(row);
  }
  const source = assignments.groups || assignments.assignments || assignments;
  if(!source || typeof source !== "object") return [];
  const key = Object.keys(source).find(k => k.toString().trim().toUpperCase() === g);
  return key ? extractIds(source[key]) : [];
}

function saveBackup(sub){
  const old=JSON.parse(localStorage.getItem("spice_submission_backups")||"[]");
  old.push(sub);
  localStorage.setItem("spice_submission_backups",JSON.stringify(old));
}

function submissionCheckParams(sub){
  if(sub.submissionType==="sequence_rating"){
    const itemId=Object.keys(sub.responses||{})[0]||"";
    return {
      action:"check",
      submissionType:"sequence_rating",
      pid:sub.pid||"",
      groupId:sub.groupId||"",
      itemId
    };
  }

  if(sub.submissionType==="session_complete"){
    return {
      action:"check",
      submissionType:"session_complete",
      pid:sub.pid||"",
      groupId:sub.groupId||""
    };
  }

  return null;
}

function sleep(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

async function confirmSavedSubmission(sub){
  const params=submissionCheckParams(sub);

  if(!params){
    throw new Error("Cannot verify unknown submission type.");
  }

  // Apps Script/Google Sheets can take a short moment to finish writing.
  // Poll the read-only JSONP endpoint until the expected row exists.
  for(let attempt=0;attempt<10;attempt++){
    if(attempt>0){
      await sleep(700);
    }

    const result=await jsonp(
      CONFIG.googleAppsScriptUrl,
      {
        ...params,
        t:Date.now()
      }
    );

    if(result?.ok && result?.saved){
      return result;
    }

    if(result?.ok===false && result?.error){
      throw new Error(result.error);
    }
  }

  throw new Error(
    "The response was sent, but Google Sheets did not confirm that it was saved. Please do not close this page; contact the researcher."
  );
}

async function submit(sub){
  saveBackup(sub);

  if(!onlineReady()){
    if(CONFIG.requireOnlineSubmission){
      throw new Error("Google Apps Script URL is not configured.");
    }
    return {status:"local_only"};
  }

  // POST is intentionally no-cors for Apps Script compatibility.
  // We DO NOT trust the POST itself as proof of saving.
  await fetch(
    CONFIG.googleAppsScriptUrl,
    {
      method:"POST",
      mode:"no-cors",
      headers:{
        "Content-Type":"text/plain;charset=utf-8"
      },
      body:JSON.stringify(sub)
    }
  );

  // Confirm from Google Sheets through a JSONP GET before continuing.
  await confirmSavedSubmission(sub);

  return {status:"saved"};
}

function buildReferenceFiles(item){
  if(Array.isArray(item.references) && item.references.length){
    return item.references.flatMap(group =>
      (group.files || []).map(file => ({
        character: group.character || "Reference",
        file
      }))
    );
  }

  if(Array.isArray(item.refFiles) && item.refFiles.length){
    return item.refFiles.map(file => ({
      character:"Reference",
      file
    }));
  }

  return [];
}

function normalizeStory(storyData,item){
  const title =
    storyData.title ||
    storyData.story_title ||
    storyData.name ||
    item.title ||
    `Story ${item.storyId}`;

  const summary =
    storyData.summary ||
    storyData.story_summary ||
    storyData.story_all_content_en ||
    storyData.story ||
    storyData.content ||
    "Read the story information and generated frames below.";

  let charText=[];

  if(Array.isArray(storyData.characters)){
    charText=storyData.characters;
  } else if(Array.isArray(storyData.character_info)){
    charText=storyData.character_info;
  } else if(
    storyData.story_all_characters_info &&
    typeof storyData.story_all_characters_info === "object"
  ){
    charText=Object.entries(storyData.story_all_characters_info).map(
      ([name,desc]) => ({
        name,
        description:
          typeof desc === "string"
            ? desc
            : JSON.stringify(desc)
      })
    );
  }

  charText=charText.map((c,i)=>({
    name:
      c.name ||
      c.character_name ||
      `Character ${i+1}`,
    description:
      c.description ||
      c.prompt ||
      c.info ||
      ""
  }));

  const chars=[];

  if(Array.isArray(item.references) && item.references.length){
    item.references.forEach((group,groupIndex)=>{
      const groupName = group.character || `Character ${groupIndex+1}`;

      const textInfo = charText.find(c =>
        String(c.name).trim().toLowerCase() ===
        String(groupName).trim().toLowerCase()
      );

      (group.files || []).forEach((file,fileIndex)=>{
        chars.push({
          name:groupName,
          description:textInfo?.description || "",
          ref:file,
          refIndex:fileIndex
        });
      });
    });
  } else {
    const refs=buildReferenceFiles(item);
    refs.forEach((ref,index)=>{
      chars.push({
        name:ref.character || `Reference ${index+1}`,
        description:"",
        ref:ref.file
      });
    });
  }

  const rawShots =
    storyData.shots ||
    storyData.Shots ||
    storyData.storyboard ||
    [];

  let textShots=[];

  if(Array.isArray(rawShots)){
    textShots=rawShots.map((s,i)=>({
      shotId:
        s.shot_id ||
        s.id ||
        `shot_${pad2(i)}`,
      n:i+1,
      plot:
        s.plot ||
        s.plot_en ||
        s["Plot Correspondence"]?.en ||
        s.shot_plot_correspondence_en ||
        s.caption ||
        s.description ||
        "",
      setting:
        s.setting ||
        s.setting_en ||
        s["Setting Description"]?.en ||
        s.shot_setting_description_en ||
        "",
      staticDesc:
        s.static ||
        s.static_en ||
        s["Static Shot Description"]?.en ||
        s.shot_static_shot_description_en ||
        "",
      characters:
        s.characters ||
        s.character_names ||
        s.characterNames ||
        s.characters_in_shot ||
        s["Characters"] ||
        []
    }));
  }

  // Prefer rich frame records from manifest.json.
  // Missing frames are skipped completely, but each available image
  // still maps to its ORIGINAL story shot via shotNumber.
  const frameRecords =
    Array.isArray(item.frames)
      ? item.frames
      : [];

  let shots=[];

  if(frameRecords.length){
    shots = frameRecords
      .filter(f => !f.missing && f.file)
      .map(f => {
        const originalIndex = Math.max(0, (f.shotNumber || 1) - 1);
        const textShot = textShots[originalIndex] || {};

        return {
          shotId:
            textShot.shotId ||
            `shot_${pad2(f.shotNumber || originalIndex + 1)}`,
          n:f.shotNumber || originalIndex + 1,
          plot:textShot.plot || "",
          setting:textShot.setting || "",
          staticDesc:textShot.staticDesc || "",
          characters:textShot.characters || [],
          frame:f.file
        };
      });
  } else {
    // Backward-compatible fallback for older manifests.
    const frameFiles =
      Array.isArray(item.frameFiles)
        ? item.frameFiles
        : [];

    shots = frameFiles
      .map((frameFile,i)=>({frameFile,i}))
      .filter(x => !!x.frameFile)
      .map(({frameFile,i})=>{
        const textShot=textShots[i] || {};

        return {
          shotId:
            textShot.shotId ||
            `shot_${pad2(i+1)}`,
          n:i+1,
          plot:textShot.plot || "",
          setting:textShot.setting || "",
          staticDesc:textShot.staticDesc || "",
          characters:textShot.characters || [],
          frame:frameFile
        };
      });
  }

  return {
    title,
    summary,
    characters:chars,
    shots
  };
}


function mappingStoryKey(storyId){
  const raw=String(storyId ?? "").trim();
  const m=raw.match(/(\d+)/);
  return m
    ? `story_${pad2(Number(m[1]))}`
    : raw;
}

function validateCharacterMapping(manifest,mapping){
  if(!mapping || typeof mapping!=="object"){
    throw new Error(
      "shot_character_mapping.json could not be loaded."
    );
  }

  const items=Array.isArray(manifest?.items)
    ? manifest.items
    : [];

  if(!items.length){
    throw new Error(
      "manifest.json contains no survey items."
    );
  }

  const checked=new Set();

  items.forEach(item=>{
    const storyKey=mappingStoryKey(item.storyId);

    if(checked.has(storyKey)) return;
    checked.add(storyKey);

    const storyMap=mapping[storyKey];

    if(!storyMap || typeof storyMap!=="object"){
      throw new Error(
        `Verified character mapping is missing ${storyKey}.`
      );
    }

    const expectedFrames=Number(
      item.numFrames ||
      item.expectedFrames ||
      item.frameFiles?.length ||
      item.frames?.length ||
      0
    );

    if(!expectedFrames){
      throw new Error(
        `Cannot determine expected frame count for ${storyKey}.`
      );
    }

    for(let n=1;n<=expectedFrames;n++){
      const shotKey=`shot_${pad2(n)}`;

      if(!Object.prototype.hasOwnProperty.call(storyMap,shotKey)){
        throw new Error(
          `Verified character mapping is missing ${storyKey} / ${shotKey}.`
        );
      }

      if(!Array.isArray(storyMap[shotKey])){
        throw new Error(
          `${storyKey} / ${shotKey} must contain a character-name array.`
        );
      }
    }
  });

  return true;
}

function validateStoryCharacterNames(item,story,mapping){
  const storyKey=mappingStoryKey(item.storyId);
  const storyMap=mapping?.[storyKey]||{};
  const referenceNames=
    groupReferenceCharacters(story.characters)
      .map(g=>g.name);

  const unknown=[];

  Object.entries(storyMap).forEach(([shotKey,names])=>{
    (names||[]).forEach(name=>{
      const exists=referenceNames.some(
        ref=>ref.toLowerCase()===String(name).toLowerCase()
      );

      if(!exists){
        unknown.push(`${shotKey}: ${name}`);
      }
    });
  });

  if(unknown.length){
    throw new Error(
      `Verified character mapping for ${storyKey} contains character name(s) `+
      `that are not available in this story's reference-character list: `+
      unknown.slice(0,8).join(", ")+
      (unknown.length>8?" …":"")
    );
  }

  return true;
}

function buildCharacterComparisonGroups(story,item,mapping){
  const refs=groupReferenceCharacters(story.characters);
  const storyKey=mappingStoryKey(item.storyId);
  const storyMap=mapping?.[storyKey];

  if(!storyMap){
    throw new Error(
      `Verified character mapping is unavailable for ${storyKey}.`
    );
  }

  return refs.map(group=>({
    ...group,
    shots:story.shots.filter(shot=>{
      const shotKey=`shot_${pad2(shot.n)}`;
      const intended=storyMap[shotKey]||[];

      return intended.some(
        name=>
          String(name).toLowerCase()===
          group.name.toLowerCase()
      );
    })
  }));
}

function chooseAlignmentShots(shots,k){
  if(shots.length<=k) return shots;
  if(k<=1) return [shots[0]];
  const idx=[];
  for(let i=0;i<k;i++) idx.push(Math.round(i*(shots.length-1)/(k-1)));
  return [...new Set(idx)].map(i=>shots[i]).slice(0,k);
}

function ImageWithFallback({src,alt,cls,label,zoomable=false}){
  const[bad,setBad]=useState(false);
  const[open,setOpen]=useState(false);
  if(src&&!bad){
    const image=React.createElement("img",{src,alt,className:cls,onError:()=>setBad(true)});
    if(!zoomable) return image;
    return React.createElement(
      React.Fragment,
      null,
      React.createElement("button",{type:"button",className:"zoomable-image-button",onClick:()=>setOpen(true),"aria-label":`Enlarge ${alt||label||"image"}`},image),
      React.createElement("div",{className:"zoom-hint"},"Click image to enlarge"),
      open&&React.createElement(
        "div",{className:"lightbox",role:"dialog","aria-modal":"true",onClick:()=>setOpen(false)},
        React.createElement("div",{className:"lightbox-inner",onClick:e=>e.stopPropagation()},
          React.createElement("button",{type:"button",className:"lightbox-close",onClick:()=>setOpen(false)},"Close"),
          React.createElement("img",{src,alt:alt||label||"Enlarged image"})
        )
      )
    );
  }
  return React.createElement("div",{className:"fallback"},label||"image missing")
}

        const raw=await getJson(storyBase(item)+(item.storyFile||"story.json"));

    setResp(p=>{
      const rr={...(p[ik]||{na:[],alignment:{},alignmentNA:[]})};
      rr.alignment={...(rr.alignment||{}),[key]:v};

  const [charIdx,setCharIdx]=useState(0);

  useEffect(()=>setCharIdx(startAtEnd?Math.max(0,groups.length-1):0),[ik,startAtEnd,groups.length]);

  const group=groups[Math.min(charIdx,Math.max(0,groups.length-1))];
  const r=resp[ik]||{na:[],characterRatings:{}};
  const cr=group ? ((r.characterRatings||{})[group.name]||{}) : {};

  function rate(field,v){
    if(!group)return;
    setResp(p=>{
      const rr={...(p[ik]||{na:[],characterRatings:{}})};
      rr.characterRatings={...(rr.characterRatings||{})};
      const x={...(rr.characterRatings[group.name]||{})};
      x[field]=v;
      x[field+"NA"]=false;
      rr.characterRatings[group.name]=x;
      return {...p,[ik]:rr};
    });
  }

  function toggleNA(field){
    if(!group)return;
    setResp(p=>{
      const rr={...(p[ik]||{na:[],characterRatings:{}})};
      rr.characterRatings={...(rr.characterRatings||{})};
      const x={...(rr.characterRatings[group.name]||{})};
      const key=field+"NA";
      x[key]=!x[key];
      if(x[key]) delete x[field];
      rr.characterRatings[group.name]=x;
      return {...p,[ik]:rr};
    });

  function characterComplete(g){
    if(!g.shots.length) return true;

    const identityDone=typeof x.identity==="number"||x.identityNA===true;

function SceneStage({item,story,resp,setResp,onNext,onBack,startAtQuestions=false}){
  const ik=itemKey(item);

  const [idx,setIdx]=useState(0);
  const [seen,setSeen]=useState(()=>new Set());
  const [questionsVisible,setQuestionsVisible]=useState(false);

  useEffect(()=>{
    if(startAtQuestions && story.shots.length){
      setIdx(story.shots.length-1);
      setQuestionsVisible(true);
      setSeen(new Set(story.shots.map(s=>s.shotId)));
    }else{
      setIdx(0);
      setQuestionsVisible(false);
      setSeen(story.shots.length?new Set([story.shots[0].shotId]):new Set());
    }
  },[ik,startAtQuestions]);

  const shot=story.shots[idx];

  function rate(qid,v){
    setResp(p=>{
      const rr={...(p[ik]||{na:[]})};
      rr[qid]=v;
      if(qid==="q4_background") rr.q4_background_is_na=false;
      return {...p,[ik]:rr};
    });
  }

  function toggleBackgroundNA(){
    setResp(p=>{
      const rr={...(p[ik]||{na:[]})};
      rr.q4_background_is_na=!rr.q4_background_is_na;
      if(rr.q4_background_is_na) delete rr.q4_background;
      return {...p,[ik]:rr};
    });

  function inspect(nextIdx){
    const safeIdx=Math.max(0,Math.min(story.shots.length-1,nextIdx));
    setIdx(safeIdx);
    setSeen(prev=>{
      const next=new Set(prev);
      const target=story.shots[safeIdx];
      if(target) next.add(target.shotId);
      return next;
    });

  function nextOrQuestions(){

function RadarChart({components}){
  const cx=210;
  const cy=210;
  const radius=135;
  const levels=5;
  const count=components.length;
  const available=components.filter(c=>typeof c.value==="number");
  const strongest=available.length ? available.reduce((a,b)=>b.value>a.value?b:a) : null;
  const lowest=available.length ? available.reduce((a,b)=>b.value<a.value?b:a) : null;

  function pointFor(index,fraction){
    const angle=
      -Math.PI/2+
      (Math.PI*2*index/count);

    return {
      x:cx+Math.cos(angle)*radius*fraction,
      y:cy+Math.sin(angle)*radius*fraction
    };
  }

  function polygonPoints(fraction){
    return components
      .map((_,i)=>{
        const p=pointFor(i,fraction);
        return `${p.x},${p.y}`;
      })
      .join(" ");
  }

  const profilePoints=
    components
      .map((c,i)=>{
        const fraction=
          typeof c.value==="number"
            ? Math.max(
                0,
                Math.min(
                  1,
                  c.value/5
                )
              )
            : 0;

        const p=pointFor(
          i,
          fraction
        );

        return `${p.x},${p.y}`;
      })
      .join(" ");

  return React.createElement(
    "div",
    {className:"radar-shell"},

    React.createElement(
      "div",
      {className:"radar-title"},
      "Your consistency profile"
    ),

    React.createElement(
      "div",
      {className:"radar-subtitle"},
      "This graph summarizes your ratings. Farther from the center means stronger perceived consistency."
    ),

    React.createElement(
      "svg",
      {
        className:"radar-svg",
        viewBox:"0 0 420 420",
        role:"img",
        "aria-label":"Radar chart of rated visual consistency dimensions"
      },

      Array.from(
        {length:levels},
        (_,i)=>
          React.createElement(
            "polygon",
            {
              key:`grid-${i}`,
              className:"radar-grid",
              points:polygonPoints(
                (i+1)/levels
              )
            }
          )
      ),

      components.map((c,i)=>{
        const p=pointFor(i,1);

        return React.createElement(
          "line",
          {
            key:`axis-${c.key}`,
            className:"radar-axis",
            x1:cx,
            y1:cy,
            x2:p.x,
            y2:p.y
          }
        );
      }),

      React.createElement(
        "polygon",
        {
          className:"radar-profile",
          points:profilePoints
        }
      ),

      components.map((c,i)=>{
        const fraction=
          typeof c.value==="number"
            ? Math.max(
                0,
                Math.min(
                  1,
                  c.value/5
                )
              )
            : 0;

        const p=pointFor(
          i,
          fraction
        );

        return React.createElement(
          "circle",
          {
            key:`point-${c.key}`,
            className:"radar-point",
            cx:p.x,
            cy:p.y,
            r:5
          }
        );
      }),

      components.map((c,i)=>{
        const p=pointFor(i,1.18);

        const anchor=
          Math.abs(p.x-cx)<12
            ? "middle"
            : p.x>cx
              ? "start"
              : "end";

        return React.createElement(
          "text",
          {
            key:`label-${c.key}`,
            className:"radar-label",
            x:p.x,
            y:p.y,
            textAnchor:anchor,
            dominantBaseline:"middle"
          },
          c.shortLabel
        );
      })
    ),

    strongest&&lowest&&React.createElement(
      "div",
      {className:"radar-summary"},
      React.createElement(
        "div",
        {className:"radar-summary-item"},
        React.createElement("strong",null,"Highest-rated component"),
        `${strongest.label}: ${strongest.value.toFixed(1)} / 5`
      ),
      React.createElement(
        "div",
        {className:"radar-summary-item"},
        React.createElement("strong",null,"Lowest-rated component"),
        `${lowest.label}: ${lowest.value.toFixed(1)} / 5`
      )
    ),

    React.createElement(
      "div",
      {className:"radar-note"},
      "The graph reflects your ratings for this generated story output."
    )
  );
}

function ComponentStage({item,story,stage,resp,setResp,onNext,submitting}) {

  const info = COMPONENT_STAGE_INFO[stage];
  const isLast = stage === "overall";

  function rate(qid,v) {
    setResp(p => {
      const rr = {...(p[ik] || {na:[]})};
      rr[qid] = v;
      rr.na = (rr.na || []).filter(x => x !== qid);
      return {...p,[ik]:rr};
    });
  }

  function na(qid) {
    setResp(p => {
      const rr = {...(p[ik] || {na:[]})};
      const a = rr.na || [];
      if (a.includes(qid)) { rr.na = a.filter(x => x !== qid); } 
      else { rr.na = [...a,qid]; delete rr[qid]; }
      return {...p,[ik]:rr};
    });
  }

  const complete = questions.every(q => typeof r[q.id] === "number" || (r.na || []).includes(q.id));

  return React.createElement("div",{className:"page"},
    React.createElement("div",{className:"sequence-stage-layout"},
      React.createElement(SequencePanel, {

        title:info.title,

function App(){
  const[phase,setPhase]=useState("loading");
  const[manifest,setManifest]=useState(null);
  const[assign,setAssign]=useState(null);
  const[characterMapping,setCharacterMapping]=useState(null);
  const[err,setErr]=useState("");
  const[pid,setPid]=useState("");
  const[meta,setMeta]=useState(null);
  const[items,setItems]=useState([]);
  const[itemIdx,setItemIdx]=useState(0);
  const[story,setStory]=useState(null);
  const[alignShots,setAlignShots]=useState([]);
  const[alignIdx,setAlignIdx]=useState(0);
  const[resp,setResp]=useState({});
  const[submitting,setSubmitting]=useState(false);
  const[status,setStatus]=useState("sent");
  const[componentImportance,setComponentImportance]=useState(null);
  const[characterReturnEnd,setCharacterReturnEnd]=useState(false);
  const[sceneReturnQuestions,setSceneReturnQuestions]=useState(false);

  useEffect(()=>{
    Promise.all([
      getJson("data/manifest.json"),
      getJson("data/assignments.json"),
      getJson("data/shot_character_mapping.json")
    ])
      .then(([m,a,c])=>{
        validateCharacterMapping(m,c);
        setManifest(m);
        setAssign(a);
        setCharacterMapping(c);
        setPhase("welcome");
      })
      .catch(e=>{
        setErr(String(e));
        setPhase("welcome");
      })
  },[]);

  async function loadItem(i,itemList=items){
    try{
      const item=itemList[i];

      if(!item){
        throw new Error(
          "No item found. Please verify assignments.json, manifest.json, and shot_character_mapping.json."
        );
      }

      const storyFile = item.storyFile || "story.json";
      const storyUrl = storyBase(item) + storyFile;

      const storyData = await getJson(storyUrl);
      const st = normalizeStory(storyData,item);

      validateStoryCharacterNames(
        item,
        st,
        characterMapping
      );

      if(!st.shots.length){
        throw new Error(
          `No generated frames were listed for ${item.itemId}. Check frameFiles in manifest.json.`
        );
      }

      setStory(st);
      setAlignShots(
        chooseAlignmentShots(
          st.shots,
          CONFIG.alignmentShotsPerItem
        )
      );
      setAlignIdx(0);
      setCharacterReturnEnd(false);
      setSceneReturnQuestions(false);
      setPhase("intro");

    }catch(e){
      console.error(e);
      setErr(String(e));
      setPhase("runtime_error");
    }
  }

  function start(){
    setPid(getOrCreatePID());
    setPhase("consent");
  }

  async function setupDone(m){
    setMeta(m);
    const ids=getAssignmentIds(assign,m.groupId);
    const itemObjs=ids.map(id=>(manifest.items||[]).find(x=>x.itemId===id)).filter(Boolean);
    if(itemObjs.length!==CONFIG.itemsPerParticipant){
      setErr(`Group ${m.groupId} should contain exactly ${CONFIG.itemsPerParticipant} valid items, but ${itemObjs.length} were found.`);
      setPhase("runtime_error");
      return;
    }

    const storyIds=itemObjs.map(x=>String(x.storyId||"").replace(/\D/g,"").padStart(2,"0"));
    const models=itemObjs.map(x=>x.model);
    const badStory=storyIds.find(x=>!CONFIG.mainStoryIds.includes(x));
    if(badStory || new Set(storyIds).size!==storyIds.length || new Set(models).size!==models.length){
      setErr(`Group ${m.groupId} is not a valid v2 assignment. Main-study groups must contain four different approved stories and four different models.`);
      setPhase("runtime_error");
      return;
    }

    setItems(itemObjs);
    setItemIdx(0);
    setPhase("training");
  }

  async function finishTraining(training){
    setMeta(prev=>({
      ...(prev||{}),
      trainingCompleted:true,
      trainingVersion:CONFIG.trainingVersion,
      trainingCalibrationComplete:training?.completed===true
    }));
    await loadItem(0,items);
  }

  function nextIntro(){setPhase("alignment")}
  function backFromIntro(){if(itemIdx===0)setPhase("training")}
  function backFromAlignment(){if(alignIdx>0)setAlignIdx(alignIdx-1);else setPhase("intro")}
  function nextAlign(){if(alignIdx<alignShots.length-1)setAlignIdx(alignIdx+1);else{setCharacterReturnEnd(false);setPhase("character")}}
  function backFromCharacter(){setAlignIdx(Math.max(0,alignShots.length-1));setPhase("alignment")}
  function toScene(){setSceneReturnQuestions(false);setPhase("scene")}
  function backFromScene(){setCharacterReturnEnd(true);setPhase("character")}
  function toOverall(){setSceneReturnQuestions(false);setPhase("overall")}
  function backFromOverall(){setSceneReturnQuestions(true);setPhase("scene")}
  function averageAlignment(r){
    const vals=Object.values(r.alignment||{}).filter(v=>typeof v==="number");
    return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:"";
  }

  function averageCharacterRating(r,field){
    const vals=Object.values(r.characterRatings||{})
      .map(x=>x?.[field])
      .filter(v=>typeof v==="number");
    return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:"";
  }

  function pCopySummary(r){
    const entries=Object.values(r.repetition||{});
    const judgments=entries.map(x=>x&&typeof x==="object"?x.judgment:x).filter(Boolean);
    const n=judgments.length;
    const count=value=>judgments.filter(x=>x===value).length;
    const distinct=count("distinct");
    const similar=count("similar");
    const nearDuplicate=count("near_duplicate");
    return {
      n,
      distinct,
      similar,
      nearDuplicate,
      distinctRate:n?distinct/n:"",
      similarRate:n?similar/n:"",
      nearDuplicateRate:n?nearDuplicate/n:""
    };
  }

  async function finishSeq(){
    const item=items[itemIdx];
    const ik=itemKey(item);
    const itemResp=resp[ik]||{};
    const pcopy=pCopySummary(itemResp);
    const identityMean=averageCharacterRating(itemResp,"identity");
    const attributeMean=averageCharacterRating(itemResp,"attribute");
    const submission={
      submissionType:"sequence_rating",
      surveyVersion:CONFIG.surveyVersion,
      dataset:CONFIG.dataset,
      pid,
      groupId:meta.groupId,
      timestamp:new Date().toISOString(),
      participantMeta:meta,
      itemIndex:itemIdx+1,
      totalItems:items.length,
      itemMeta:item,
      responses:{
        [ik]:{
          ...itemResp,
          q1_alignment:averageAlignment(itemResp),
          q2_identity:identityMean,
          q3_attribute:attributeMean,
          p_copy_summary:pcopy,
          p_ref_human_penalty:
            typeof itemResp.q7_reference_reuse==="number"
              ? 6-itemResp.q7_reference_reuse
              : ""
        }
      }
    };
    setSubmitting(true);
    try{
      const result=await submit(submission);
      setStatus(result.status||"sent")
    }catch(e){
      console.error(e);
      setStatus("error")
    }
    setSubmitting(false);
    if(itemIdx<items.length-1){
      const ni=itemIdx+1;
      setItemIdx(ni);
      await loadItem(ni,items);
    }else{
      setPhase("importance");
    }
  }

  async function finishSession(importance){
    setComponentImportance(importance);
    setSubmitting(true);

    const completion={
      submissionType:"session_complete",
      surveyVersion:CONFIG.surveyVersion,
      dataset:CONFIG.dataset,
      pid,
      groupId:meta.groupId,
      timestamp:new Date().toISOString(),
      participantMeta:meta,
      completedItems:items.length,
      componentImportance:importance
    };

    try{
      const finalResult=
        await submit(completion);

      if(finalResult.status){
        setStatus(finalResult.status);
      }

      localStorage.setItem(
        "spice_study_completed",
        "true"
      );

      setPhase("done");

    }catch(e){
      console.error(e);
      setStatus("error");
    }

    setSubmitting(false);
  }

  if(phase==="loading")return React.createElement("div",{className:"page"},React.createElement("div",{className:"card"},"Loading..."));
  const cur=items[itemIdx];
  return React.createElement("div",null,
    phase==="welcome"&&React.createElement(Welcome,{start,loadError:err}),
    phase==="consent"&&React.createElement(Consent,{onGo:()=>setPhase("setup"),onBack:()=>setPhase("welcome")}),
    phase==="setup"&&React.createElement(Setup,{assignments:assign||{},pid,onGo:setupDone,onBack:()=>setPhase("consent")}),
    phase==="training"&&React.createElement(TrainingStage,{manifest,onComplete:finishTraining,onBack:()=>setPhase("setup")}),
    phase==="intro"&&story&&React.createElement(Intro,{item:cur,story,onNext:nextIntro,onBack:itemIdx===0?backFromIntro:null,itemNo:itemIdx+1,total:items.length}),
    phase==="alignment"&&story&&React.createElement(Alignment,{item:cur,story,shots:alignShots,idx:alignIdx,resp,setResp,onNext:nextAlign,onBack:backFromAlignment}),
    phase==="character"&&story&&React.createElement(CharacterStage,{item:cur,story,characterMapping,resp,setResp,onNext:toScene,onBack:backFromCharacter,startAtEnd:characterReturnEnd}),
    phase==="scene"&&story&&React.createElement(SceneStage,{item:cur,story,resp,setResp,onNext:toOverall,onBack:backFromScene,startAtQuestions:sceneReturnQuestions}),
    phase==="overall"&&story&&React.createElement(OverallStage,{item:cur,story,resp,setResp,onNext:finishSeq,onBack:backFromOverall,submitting}),
    phase==="importance"&&React.createElement(ComponentImportance,{onSubmit:finishSession,submitting}),
    phase==="done"&&React.createElement(Done,{pid,status}),
    phase==="runtime_error"&&React.createElement(RuntimeError,{message:err,onBack:()=>setPhase("setup")})
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(React.createElement(App));
</script>
</body>
</html>
